or lleva a sus ovejas a pastos verdes y aguas tranquilas para que descansen. Así Dios nos da descanso y renueva nuestra alma, y nos guía por buenos caminos."},{"libro":"Isaías","cap":"35","vers":"4","texto":"Decid a los de corazón apocado: Esforzaos, no temáis; he aquí que vuestro Dios viene y os salvará.","explica":"El profeta da un mensaje para los que tienen el corazón con miedo: sean fuertes, no teman, Dios viene a salvarlos. Dios no abandona a los suyos."},{"libro":"Lucas","cap":"2","vers":"10-11","texto":"Pero el ángel les dijo: No temáis; porque he aquí os doy nuevas de gran gozo, que será para todo el pueblo: que os ha nacido hoy, en la ciudad de David, un Salvador, que es Cristo el Señor.","explica":"Así anunció el ángel a los pastores el nacimiento de Jesús. Fue una noticia de gran alegría para todo el mundo: nació el Salvador. Esa alegría también es para ti hoy."},{"libro":"Salmos","cap":"66","vers":"20","texto":"Bendito sea Dios, que no echó de sí mi oración, ni de mí su misericordia.","explica":"El salmista da gracias porque Dios no rechazó su oración ni le quitó su amor. Dios escucha nuestras oraciones y nunca nos retira su cariño."},{"libro":"Romanos","cap":"8","vers":"1","texto":"Ahora, pues, ninguna condenación hay para los que están en Cristo Jesús.","explica":"Para quienes están con Jesús ya no hay condenación. Él pagó por nuestras culpas. Por eso no tenemos que vivir con miedo al castigo, sino en paz con Dios."},{"libro":"Salmos","cap":"119","vers":"165","texto":"Mucha paz tienen los que aman tu ley, y no hay para ellos tropiezo.","explica":"Quienes aman la Palabra de Dios tienen mucha paz, y no tropiezan fácilmente. Conocer y vivir lo que Dios dice nos da tranquilidad y firmeza."},{"libro":"2 Crónicas","cap":"7","vers":"14","texto":"Si se humillare mi pueblo, sobre el cual mi nombre es invocado, y oraren, y buscaren mi rostro, y se convirtieren de sus malos caminos; entonces yo oiré desde los cielos, y perdonaré sus pecados, y sanaré su tierra.","explica":"Dios le hizo esta promesa a su pueblo: si se humillan, oran, lo buscan y dejan lo malo, Él los escucha, los perdona y sana su tierra. La oración humilde tiene poder."},{"libro":"Salmos","cap":"130","vers":"5","texto":"Esperé yo a Jehová, esperó mi alma; en su palabra he esperado.","explica":"El salmista espera en Dios con todo su ser y confía en su palabra. Esperar en Dios es como el centinela que espera la mañana: sabe que va a llegar."},{"libro":"Juan","cap":"1","vers":"12","texto":"Mas a todos los que le recibieron, a los que creen en su nombre, les dio potestad de ser hechos hijos de Dios.","explica":"A todos los que reciben a Jesús, Dios les da el derecho de ser sus hijos. No somos solo criaturas de Dios: somos parte de su familia."},{"libro":"Salmos","cap":"142","vers":"5","texto":"Clamé a ti, oh Jehová; dije: Tú eres mi esperanza, y mi porción en la tierra de los vivientes.","explica":"David estaba escondido en una cueva, solo y perseguido. Aun así clamó a Dios y le dijo: tú eres mi esperanza y lo único que necesito. Dios nos escucha aun en la cueva."},{"libro":"Proverbios","cap":"14","vers":"26","texto":"En el temor de Jehová está la fuerte confianza; y esperanza tendrán sus hijos.","explica":"Quien respeta y ama a Dios tiene una confianza firme, y esa fe se convierte en un refugio para sus hijos. La fe de los padres y abuelos protege a la familia."},{"libro":"Salmos","cap":"31","vers":"14-15","texto":"Mas yo en ti confío, oh Jehová; digo: Tú eres mi Dios. En tu mano están mis tiempos.","explica":"David dice: en tus manos están mis tiempos. Todo lo que vivimos, los días buenos y los malos, está en las manos de Dios. Eso da mucha paz."},{"libro":"1 Juan","cap":"3","vers":"1","texto":"Mirad cuál amor nos ha dado el Padre, para que seamos llamados hijos de Dios.","explica":"Juan se asombra del amor de Dios: nos ama tanto que nos llama hijos suyos. ¡Y lo somos de verdad! Esa es nuestra identidad más importante."},{"libro":"Salmos","cap":"145","vers":"9","texto":"Bueno es Jehová para con todos, y sus misericordias sobre todas sus obras.","explica":"Dios es bueno con todos, y su compasión alcanza a todo lo que Él creó. Su bondad no es solo para unos pocos: es para todos."},{"libro":"Habacuc","cap":"3","vers":"19","texto":"Jehová el Señor es mi fortaleza, el cual hace mis pies como de ciervas, y en mis alturas me hace andar.","explica":"El profeta dice que Dios le da pies de cierva, ágiles y seguros para andar por lugares altos y difíciles. Dios nos da firmeza para caminar por terrenos complicados."},{"libro":"Mateo","cap":"5","vers":"7","texto":"Bienaventurados los misericordiosos, porque ellos alcanzarán misericordia.","explica":"Jesús dice que los que tienen compasión y perdonan recibirán compasión. La misericordia que damos a otros vuelve a nosotros."},{"libro":"Salmos","cap":"34","vers":"1","texto":"Bendeciré a Jehová en todo tiempo; su alabanza estará de continuo en mi boca.","explica":"David decide alabar a Dios en todo tiempo, en los días buenos y en los malos. La alabanza no depende de las circunstancias, sino de quién es Dios."},{"libro":"Juan","cap":"12","vers":"46","texto":"Yo, la luz, he venido al mundo, para que todo aquel que cree en mí no permanezca en tinieblas.","explica":"Jesús vino como luz al mundo para que nadie que crea en Él se quede en la oscuridad. Con Él siempre hay una luz, aun en la noche más oscura."},{"libro":"Salmos","cap":"62","vers":"8","texto":"Esperad en él en todo tiempo, oh pueblos; derramad delante de él vuestro corazón; Dios es nuestro refugio.","explica":"El salmista nos invita a confiar en Dios siempre y a derramar el corazón delante de Él: contarle todo, lo bueno y lo malo. Dios es nuestro refugio."},{"libro":"Isaías","cap":"25","vers":"8","texto":"Destruirá a la muerte para siempre; y enjugará Jehová el Señor toda lágrima de todos los rostros.","explica":"Isaías anuncia que Dios vencerá a la muerte para siempre y secará las lágrimas de todos los rostros. Es una promesa de consuelo total."},{"libro":"Salmos","cap":"119","vers":"130","texto":"La exposición de tus palabras alumbra; hace entender a los simples.","explica":"Cuando la Palabra de Dios se explica, trae luz y hace entender aun a los sencillos. No hace falta ser estudiado para comprender a Dios: Él se deja entender."},{"libro":"Filipenses","cap":"4","vers":"4","texto":"Regocijaos en el Señor siempre. Otra vez digo: ¡Regocijaos!","explica":"Pablo escribió esto desde la cárcel, y aun así dice: alégrense siempre en el Señor. La alegría del creyente no depende de las circunstancias, sino de Dios."},{"libro":"Salmos","cap":"100","vers":"1-2","texto":"Cantad alegres a Dios, habitantes de toda la tierra. Servid a Jehová con alegría; venid ante su presencia con regocijo.","explica":"Este salmo invita a todo el mundo a cantar con alegría a Dios y a servirle con gusto. Acercarse a Dios no es algo triste: es motivo de fiesta."},{"libro":"Romanos","cap":"12","vers":"21","texto":"No seas vencido de lo malo, sino vence con el bien el mal.","explica":"Cuando alguien nos hace mal, es fácil devolver mal. Pablo nos enseña algo mejor: vencer el mal haciendo el bien. El bien es más fuerte."},{"libro":"Salmos","cap":"121","vers":"3","texto":"No dará tu pie al resbaladero, ni se dormirá el que te guarda.","explica":"Dios no deja que nuestro pie resbale, y nunca se duerme mientras nos cuida. Nosotros dormimos, pero Él está despierto vigilando."},{"libro":"Juan","cap":"14","vers":"18","texto":"No os dejaré huérfanos; vendré a vosotros.","explica":"Jesús prometió que no nos dejaría huérfanos, solos y desamparados. Él viene a nosotros por medio de su Espíritu. Nunca estamos solos."},{"libro":"Salmos","cap":"27","vers":"4","texto":"Una cosa he demandado a Jehová, ésta buscaré; que esté yo en la casa de Jehová todos los días de mi vida, para contemplar la hermosura de Jehová.","explica":"Lo que David más deseaba en la vida era estar cerca de Dios todos los días. De todo lo que podía pedir, eligió eso: su presencia."},{"libro":"Proverbios","cap":"11","vers":"25","texto":"El alma generosa será prosperada; y el que saciare, él también será saciado.","explica":"La persona generosa termina siendo bendecida. Quien comparte con otros, recibe. La generosidad nunca nos deja más pobres."},{"libro":"Salmos","cap":"119","vers":"11","texto":"En mi corazón he guardado tus dichos, para no pecar contra ti.","explica":"Guardar la Palabra de Dios en el corazón, aprendiéndola y recordándola, nos ayuda a no hacer lo malo. Por eso es tan bueno escuchar un versículo cada día."},{"libro":"Efesios","cap":"3","vers":"17","texto":"Para que habite Cristo por la fe en vuestros corazones, a fin de que, arraigados y cimentados en amor.","explica":"Pablo ora para que Cristo viva en nuestro corazón por la fe, y que estemos arraigados en su amor, como un árbol con raíces profundas que no se cae con el viento."},{"libro":"Salmos","cap":"47","vers":"1","texto":"Pueblos todos, batid las manos; aclamad a Dios con voz de júbilo.","explica":"Este salmo invita a todos los pueblos a aplaudir y gritar de alegría para Dios. La fe también se celebra con alegría."},{"libro":"Génesis","cap":"28","vers":"15","texto":"He aquí, yo estoy contigo, y te guardaré por dondequiera que fueres.","explica":"Dios le dijo esto a Jacob cuando huía de casa, solo y asustado. Le prometió estar con él y cuidarlo a donde fuera. Esa promesa también es para nosotros."},{"libro":"Salmos","cap":"37","vers":"7","texto":"Guarda silencio ante Jehová, y espera en él.","explica":"Guardar silencio ante Dios es dejar de quejarse y de afanarse, y esperar con paciencia. A veces lo mejor es callar y confiar en que Dios está actuando."},{"libro":"Mateo","cap":"21","vers":"22","texto":"Y todo lo que pidiereis en oración, creyendo, lo recibiréis.","explica":"Jesús enseña que la oración hecha con fe tiene poder. Dios escucha cuando oramos creyendo de verdad que Él puede responder."},{"libro":"Salmos","cap":"91","vers":"4","texto":"Con sus plumas te cubrirá, y debajo de sus alas estarás seguro; escudo y adarga es su verdad.","explica":"Dios nos protege como una gallina cubre a sus pollitos con sus alas. Bajo sus alas estamos seguros, y su fidelidad es como un escudo."},{"libro":"1 Corintios","cap":"10","vers":"13","texto":"Fiel es Dios, que no os dejará ser tentados más de lo que podéis resistir, sino que dará también juntamente con la tentación la salida, para que podáis soportar.","explica":"Dios no permite que pasemos por pruebas más grandes de lo que podemos aguantar. Y siempre nos da una salida o las fuerzas para soportar. Dios es fiel."},{"libro":"Salmos","cap":"103","vers":"1","texto":"Bendice, alma mía, a Jehová, y bendiga todo mi ser su santo nombre.","explica":"David le dice a su propia alma que bendiga a Dios con todo lo que tiene dentro. Es una manera de despertar el corazón para alabar."},{"libro":"Isaías","cap":"60","vers":"1","texto":"Levántate, resplandece; porque ha venido tu luz, y la gloria de Jehová ha nacido sobre ti.","explica":"Dios le dice a su pueblo: levántate y brilla, porque mi luz ha llegado sobre ti. Es una invitación a dejar la tristeza y recibir la luz de Dios."},{"libro":"Salmos","cap":"139","vers":"9-10","texto":"Si tomare las alas del alba y habitare en el extremo del mar, aun allí me guiará tu mano, y me asirá tu diestra.","explica":"David dice que aunque se fuera al lugar más lejano del mundo, al otro lado del mar, la mano de Dios lo encontraría y lo guiaría. No hay lugar donde Dios no esté."},{"libro":"Juan","cap":"5","vers":"24","texto":"De cierto, de cierto os digo: El que oye mi palabra, y cree al que me envió, tiene vida eterna.","explica":"Jesús promete que quien escucha su palabra y cree en Dios ya tiene vida eterna. No es algo solo para después: empieza desde ahora."},{"libro":"Salmos","cap":"18","vers":"1","texto":"Te amo, oh Jehová, fortaleza mía.","explica":"David abre este salmo con una declaración sencilla y tierna: te amo, Señor, mi fortaleza. Podemos decirle a Dios lo mismo con nuestras propias palabras."},{"libro":"Proverbios","cap":"16","vers":"9","texto":"El corazón del hombre piensa su camino; mas Jehová endereza sus pasos.","explica":"Las personas planean su camino, pero Dios es quien dirige sus pasos. Podemos tener paz sabiendo que Dios guía nuestra vida."},{"libro":"Salmos","cap":"94","vers":"18","texto":"Cuando yo decía: Mi pie resbala, tu misericordia, oh Jehová, me sustentaba.","explica":"Cuando el salmista sentía que se resbalaba y se iba a caer, el amor de Dios lo sostenía. Dios nos agarra justo cuando sentimos que nos caemos."},{"libro":"2 Corintios","cap":"1","vers":"3-4","texto":"Bendito sea el Dios y Padre de nuestro Señor Jesucristo, Padre de misericordias y Dios de toda consolación, el cual nos consuela en todas nuestras tribulaciones.","explica":"Pablo llama a Dios \"Padre de misericordias y Dios de toda consolación\". Dios nos consuela en nuestras tristezas, y así también podemos consolar a otros."},{"libro":"Salmos","cap":"25","vers":"10","texto":"Todas las sendas de Jehová son misericordia y verdad, para los que guardan su pacto y sus testimonios.","explica":"Todos los caminos de Dios están llenos de amor y verdad para quienes lo siguen. Aunque el camino sea difícil, si es el camino de Dios, es un buen camino."},{"libro":"Lucas","cap":"11","vers":"9","texto":"Y yo os digo: Pedid, y se os dará; buscad, y hallaréis; llamad, y se os abrirá.","explica":"Jesús nos anima a pedir, buscar y tocar a la puerta de Dios en oración, con confianza. Él es un Padre que quiere dar cosas buenas a sus hijos."},{"libro":"Salmos","cap":"37","vers":"3","texto":"Confía en Jehová, y haz el bien; y habitarás en la tierra, y te apacentarás de la verdad.","explica":"David da un consejo sencillo: confía en Dios y haz el bien. Con eso basta para vivir tranquilo y seguro en la tierra que Dios nos da."},{"libro":"Isaías","cap":"42","vers":"16","texto":"Delante de ellos cambiaré las tinieblas en luz, y lo escabroso en llanura. Estas cosas les haré, y no los desampararé.","explica":"Dios promete guiar a quienes no conocen el camino, convertir la oscuridad en luz y lo difícil en llano. Y termina diciendo: no los desampararé."},{"libro":"Salmos","cap":"96","vers":"1","texto":"Cantad a Jehová cántico nuevo; cantad a Jehová, toda la tierra.","explica":"Cantar un cántico nuevo es alabar a Dios por lo nuevo que hace cada día. Cada día trae nuevas razones para cantarle."},{"libro":"Romanos","cap":"14","vers":"8","texto":"Pues si vivimos, para el Señor vivimos; y si morimos, para el Señor morimos. Así pues, sea que vivamos, o que muramos, del Señor somos.","explica":"Pablo dice que vivamos o muramos, somos del Señor. Nuestra vida y nuestro final están en manos de Dios, y en ningún momento dejamos de ser suyos."},{"libro":"Salmos","cap":"73","vers":"23-24","texto":"Con todo, yo siempre estuve contigo; me tomaste de la mano derecha. Me has guiado según tu consejo, y después me recibirás en gloria.","explica":"El salmista dice que Dios lo tomó de la mano derecha, lo guió con su consejo y después lo recibirá en la gloria. Dios nos acompaña toda la vida y nos recibe al final."},{"libro":"Juan","cap":"14","vers":"3","texto":"Y si me fuere y os preparare lugar, vendré otra vez, y os tomaré a mí mismo, para que donde yo estoy, vosotros también estéis.","explica":"Jesús prometió que va a preparar un lugar para nosotros y que volverá para llevarnos con Él. Nuestro destino final es estar con Jesús para siempre."},{"libro":"Salmos","cap":"119","vers":"103","texto":"¡Cuán dulces son a mi paladar tus palabras! Más que la miel a mi boca.","explica":"El salmista dice que las palabras de Dios son más dulces que la miel. Cuando la Palabra de Dios toca el corazón, se disfruta como algo dulce y bueno."},{"libro":"Proverbios","cap":"12","vers":"25","texto":"La congoja en el corazón del hombre lo abate; mas la buena palabra lo alegra.","explica":"La preocupación hace que el corazón se sienta pesado, pero una palabra buena lo alegra. Una palabra de ánimo puede cambiarle el día a alguien."},{"libro":"Salmos","cap":"28","vers":"9","texto":"Salva a tu pueblo, y bendice a tu heredad; y pastoréales y susténtales para siempre.","explica":"David termina su oración pidiendo a Dios que salve, bendiga y pastoree a su pueblo, y que lo lleve en brazos para siempre. Es una oración por toda la familia."},{"libro":"Mateo","cap":"10","vers":"30-31","texto":"Pues aun vuestros cabellos están todos contados. Así que, no temáis; más valéis vosotros que muchos pajarillos.","explica":"Dios conoce hasta el número de cabellos de tu cabeza. Si cuida a los pajaritos, ¿cómo no te va a cuidar a ti, que vales mucho más? No hay que temer."},{"libro":"Salmos","cap":"40","vers":"5","texto":"Has aumentado, oh Jehová Dios mío, tus maravillas; y tus pensamientos para con nosotros, no es posible contarlos ante ti.","explica":"David dice que las maravillas y los planes buenos de Dios para nosotros son tantos que no se pueden contar. Dios piensa en nosotros más de lo que imaginamos."},{"libro":"Hebreos","cap":"13","vers":"8","texto":"Jesucristo es el mismo ayer, y hoy, y por los siglos.","explica":"Jesús es el mismo ayer, hoy y siempre. Todo cambia en la vida, pero Él no. El Jesús que ayudó a la gente en la Biblia nos ayuda igual hoy."},{"libro":"Salmos","cap":"86","vers":"7","texto":"En el día de mi angustia te llamaré, porque tú me respondes.","explica":"David dice con seguridad: en el día de mi angustia te llamaré, porque tú me respondes. La experiencia le enseñó que Dios contesta."},{"libro":"Isaías","cap":"54","vers":"17","texto":"Ninguna arma forjada contra ti prosperará.","explica":"Dios promete que ninguna arma hecha contra su pueblo tendrá éxito. Los ataques y las críticas no nos destruirán, porque Dios nos defiende."},{"libro":"Salmos","cap":"34","vers":"7","texto":"El ángel de Jehová acampa alrededor de los que le temen, y los defiende.","explica":"El ángel del Señor acampa alrededor de los que aman a Dios, como un guardia que monta su tienda para proteger. Estamos rodeados de su protección."},{"libro":"Juan","cap":"17","vers":"17","texto":"Santifícalos en tu verdad; tu palabra es verdad.","explica":"Jesús oró por sus discípulos y le pidió al Padre que los hiciera santos por medio de su Palabra, porque la Palabra de Dios es la verdad."},{"libro":"Salmos","cap":"111","vers":"10","texto":"El principio de la sabiduría es el temor de Jehová.","explica":"La verdadera sabiduría empieza por respetar y amar a Dios. No se trata de saber mucho, sino de vivir cerca de Él."},{"libro":"Filipenses","cap":"4","vers":"8","texto":"Todo lo que es verdadero, todo lo honesto, todo lo justo, todo lo puro, todo lo amable, todo lo que es de buen nombre; si hay virtud alguna, si algo digno de alabanza, en esto pensad.","explica":"Pablo nos enseña a cuidar nuestros pensamientos: llenarlos de cosas verdaderas, buenas, puras y bonitas. Lo que pensamos afecta cómo nos sentimos."},{"libro":"Salmos","cap":"116","vers":"7","texto":"Vuelve, oh alma mía, a tu reposo, porque Jehová te ha hecho bien.","explica":"El salmista le dice a su alma: vuelve a descansar, porque Dios ha sido bueno contigo. Recordar lo bueno que Dios ha hecho trae calma."},{"libro":"Deuteronomio","cap":"33","vers":"27","texto":"El eterno Dios es tu refugio, y acá abajo los brazos eternos.","explica":"Dios es nuestro refugio eterno, y debajo de nosotros están sus brazos eternos. Si caemos, caemos en los brazos de Dios."},{"libro":"Salmos","cap":"63","vers":"3","texto":"Porque mejor es tu misericordia que la vida; mis labios te alabarán.","explica":"David dice que el amor de Dios vale más que la vida misma. Por eso sus labios lo alaban. Nada en este mundo se compara con el amor de Dios."},{"libro":"Lucas","cap":"12","vers":"32","texto":"No temáis, manada pequeña, porque a vuestro Padre le ha placido daros el reino.","explica":"Jesús llama a sus seguidores \"manada pequeña\" con ternura, y les dice que no tengan miedo, porque al Padre le alegra darles su reino."},{"libro":"Salmos","cap":"138","vers":"3","texto":"El día que clamé, me respondiste; me fortaleciste con vigor en mi alma.","explica":"David cuenta que el día que clamó, Dios le respondió y le dio fuerzas en el alma. Dios no solo escucha: nos fortalece por dentro."},{"libro":"Romanos","cap":"5","vers":"5","texto":"Y la esperanza no avergüenza; porque el amor de Dios ha sido derramado en nuestros corazones por el Espíritu Santo que nos fue dado.","explica":"La esperanza en Dios no nos deja mal, no nos defrauda, porque el amor de Dios ya está en nuestro corazón por medio del Espíritu Santo."},{"libro":"Salmos","cap":"84","vers":"1-2","texto":"¡Cuán amables son tus moradas, oh Jehová de los ejércitos! Anhela mi alma y aun ardientemente desea los atrios de Jehová.","explica":"El salmista ama tanto la casa de Dios que su alma la desea con todas sus fuerzas. Estar con Dios es lo que más anhela su corazón."},{"libro":"Proverbios","cap":"3","vers":"3","texto":"Nunca se aparten de ti la misericordia y la verdad; átalas a tu cuello, escríbelas en la tabla de tu corazón.","explica":"Este proverbio nos pide no soltar nunca el amor y la verdad: llevarlos como un collar y escribirlos en el corazón, para que estén siempre con nosotros."},{"libro":"Salmos","cap":"145","vers":"3","texto":"Grande es Jehová, y digno de suprema alabanza; y su grandeza es inescrutable.","explica":"Dios es tan grande que no se puede medir ni entender del todo. Por eso merece toda nuestra alabanza."},{"libro":"Juan","cap":"16","vers":"22","texto":"También vosotros ahora tenéis tristeza; pero os volveré a ver, y se gozará vuestro corazón, y nadie os quitará vuestro gozo.","explica":"Jesús dijo a sus discípulos que estarían tristes cuando Él muriera, pero que lo volverían a ver y su alegría sería tan grande que nadie se la podría quitar. Esa alegría también es para nosotros."},{"libro":"Salmos","cap":"61","vers":"4","texto":"Yo habitaré en tu tabernáculo para siempre; estaré seguro bajo la cubierta de tus alas.","explica":"David desea vivir siempre en la casa de Dios, seguro bajo sus alas. Es la imagen de un lugar donde nos sentimos protegidos y en paz."},{"libro":"Isaías","cap":"57","vers":"15","texto":"Habito con el quebrantado y humilde de espíritu, para hacer vivir el espíritu de los humildes, y para vivificar el corazón de los quebrantados.","explica":"Dios, que es tan grande y vive en lo alto, también vive cerca de los humildes y de los que tienen el corazón roto. Él viene a darles vida y ánimo."},{"libro":"Salmos","cap":"119","vers":"68","texto":"Bueno eres tú, y bienhechor; enséñame tus estatutos.","explica":"El salmista dice simplemente: tú eres bueno y haces el bien. Y le pide a Dios que le enseñe. Reconocer la bondad de Dios nos abre a aprender de Él."},{"libro":"1 Tesalonicenses","cap":"5","vers":"11","texto":"Por lo cual, animaos unos a otros, y edificaos unos a otros, así como lo hacéis.","explica":"Pablo nos pide animarnos y edificarnos unos a otros. Una palabra de aliento, una llamada o una visita pueden fortalecer a alguien que lo necesita."},{"libro":"Salmos","cap":"4","vers":"7","texto":"Tú diste alegría a mi corazón mayor que la de ellos cuando abundaba su grano y su mosto.","explica":"David dice que Dios le dio una alegría más grande que la de quienes tienen mucha cosecha y mucho vino. La alegría de Dios vale más que la abundancia material."},{"libro":"Mateo","cap":"9","vers":"22","texto":"Ten ánimo, hija; tu fe te ha salvado.","explica":"Una mujer enferma por muchos años tocó el manto de Jesús con fe, y fue sanada. Jesús la miró y le dijo con cariño: \"ten ánimo, hija\". Así nos ve Jesús: como sus hijas e hijos."},{"libro":"Salmos","cap":"30","vers":"11","texto":"Has cambiado mi lamento en baile; desataste mi cilicio, y me ceñiste de alegría.","explica":"Dios cambió el llanto del salmista en baile y su ropa de luto en ropa de alegría. Dios puede transformar nuestras tristezas en alegría."},{"libro":"Jeremías","cap":"31","vers":"3","texto":"Con amor eterno te he amado; por tanto, te prolongué mi misericordia.","explica":"Dios dice: te he amado con amor eterno, un amor que no empezó ayer ni se va a acabar. Por ese amor nos sigue atrayendo hacia Él con ternura."},{"libro":"Salmos","cap":"90","vers":"1-2","texto":"Señor, tú nos has sido refugio de generación en generación. Antes que naciesen los montes y formases la tierra y el mundo, desde el siglo y hasta el siglo, tú eres Dios.","explica":"Moisés dice que Dios ha sido el refugio de todas las generaciones: de nuestros abuelos, padres, hijos y nietos. Antes de que existieran las montañas, Dios ya era Dios."},{"libro":"Juan","cap":"21","vers":"17","texto":"Señor, tú lo sabes todo; tú sabes que te amo.","explica":"Pedro había negado a Jesús tres veces. Después de resucitar, Jesús le preguntó tres veces si lo amaba, y Pedro respondió: tú lo sabes todo, sabes que te amo. Jesús lo perdonó y le dio una nueva oportunidad."},{"libro":"Salmos","cap":"9","vers":"9-10","texto":"Jehová será refugio del pobre, refugio para el tiempo de angustia. En ti confiarán los que conocen tu nombre, por cuanto tú, oh Jehová, no desamparaste a los que te buscaron.","explica":"Dios es refugio para el pobre y para el que está en angustia. Los que lo conocen confían en Él, porque Dios nunca ha abandonado a los que lo buscan."},{"libro":"Proverbios","cap":"8","vers":"17","texto":"Yo amo a los que me aman, y me hallan los que temprano me buscan.","explica":"La sabiduría de Dios dice: amo a los que me aman, y los que me buscan temprano me encuentran. Buscar a Dios en la mañana es un buen comienzo para el día."},{"libro":"Salmos","cap":"118","vers":"6","texto":"Jehová está conmigo; no temeré lo que me pueda hacer el hombre.","explica":"Si Dios está con nosotros, ¿qué nos puede hacer una persona? El salmista pierde el miedo porque sabe quién está a su lado."},{"libro":"Efesios","cap":"1","vers":"3","texto":"Bendito sea el Dios y Padre de nuestro Señor Jesucristo, que nos bendijo con toda bendición espiritual en los lugares celestiales en Cristo.","explica":"Pablo bendice a Dios porque en Cristo ya nos ha dado toda clase de bendiciones espirituales. No nos falta nada de lo que de verdad importa."},{"libro":"Salmos","cap":"52","vers":"8","texto":"En la misericordia de Dios confío eternamente y para siempre.","explica":"David se compara con un olivo verde, un árbol que vive muchos años, plantado en la casa de Dios. Confía en el amor de Dios para siempre."},{"libro":"Isaías","cap":"33","vers":"2","texto":"Oh Jehová, ten misericordia de nosotros, a ti hemos esperado; tú, brazo de ellos en la mañana, sé también nuestra salvación en tiempo de la tribulación.","explica":"Esta es una oración que pide a Dios misericordia y que sea nuestra fuerza cada mañana y nuestra salvación en los tiempos difíciles. Es perfecta para empezar el día."},{"libro":"Salmos","cap":"23","vers":"5","texto":"Aderezas mesa delante de mí en presencia de mis angustiadores; unges mi cabeza con aceite; mi copa está rebosando.","explica":"Dios nos prepara una mesa aun cuando hay problemas alrededor. Unge nuestra cabeza con aceite, como se honraba a un invitado, y llena nuestra copa hasta rebosar. Dios nos trata como invitados de honor."},{"libro":"Marcos","cap":"11","vers":"24","texto":"Por tanto, os digo que todo lo que pidiereis orando, creed que lo recibiréis, y os vendrá.","explica":"Jesús enseña a orar con fe: creer que Dios ya escuchó nuestra oración. La fe confía en Dios aun antes de ver la respuesta."},{"libro":"Salmos","cap":"119","vers":"89","texto":"Para siempre, oh Jehová, permanece tu palabra en los cielos.","explica":"La Palabra de Dios está firme en el cielo para siempre. Lo que Dios dijo no cambia con el tiempo. Sus promesas valen hoy igual que hace miles de años."},{"libro":"2 Timoteo","cap":"4","vers":"7","texto":"He peleado la buena batalla, he acabado la carrera, he guardado la fe.","explica":"Pablo escribió esto al final de su vida. Miró atrás y pudo decir: he luchado bien, he terminado la carrera, he guardado la fe. Una vida fiel a Dios es una vida bien vivida."},{"libro":"Salmos","cap":"67","vers":"1","texto":"Dios tenga misericordia de nosotros, y nos bendiga; haga resplandecer su rostro sobre nosotros.","explica":"Esta es una bendición: que Dios tenga misericordia de nosotros, nos bendiga y nos mire con su rostro brillante, como alguien que nos sonríe."},{"libro":"Juan","cap":"10","vers":"27-28","texto":"Mis ovejas oyen mi voz, y yo las conozco, y me siguen, y yo les doy vida eterna; y no perecerán jamás, ni nadie las arrebatará de mi mano.","explica":"Las ovejas reconocen la voz de su pastor. Jesús dice que sus ovejas lo escuchan y lo siguen, y que nadie las puede arrebatar de su mano. Estamos seguros en las manos de Jesús."},{"libro":"Salmos","cap":"46","vers":"11","texto":"Jehová de los ejércitos está con nosotros; nuestro refugio es el Dios de Jacob.","explica":"El Dios de los ejércitos, el Dios poderoso, está con nosotros. Él es nuestro refugio. Con Él a nuestro lado, no hay de qué temer."},{"libro":"Proverbios","cap":"30","vers":"5","texto":"Toda palabra de Dios es limpia; él es escudo a los que en él esperan.","explica":"Todo lo que Dios dice es puro y confiable. Y para los que confían en Él, Dios es como un escudo que los protege."},{"libro":"Salmos","cap":"144","vers":"15","texto":"Bienaventurado el pueblo cuyo Dios es Jehová.","explica":"Es feliz el pueblo y la familia que tiene al Señor como su Dios. La verdadera felicidad viene de tener a Dios en el centro."},{"libro":"Romanos","cap":"8","vers":"37","texto":"Antes, en todas estas cosas somos más que vencedores por medio de aquel que nos amó.","explica":"En medio de los problemas no solo sobrevivimos: somos más que vencedores, gracias a Jesús que nos ama. Su amor nos hace ganar."},{"libro":"Salmos","cap":"18","vers":"30","texto":"En cuanto a Dios, perfecto es su camino, y acrisolada la palabra de Jehová; escudo es a todos los que en él esperan.","explica":"El camino de Dios es perfecto y su palabra es pura como el oro refinado. Para todos los que confían en Él, Dios es un escudo."},{"libro":"Isaías","cap":"61","vers":"3","texto":"A ordenar que a los afligidos de Sion se les dé gloria en lugar de ceniza, óleo de gozo en lugar de luto, manto de alegría en lugar del espíritu angustiado.","explica":"Dios promete cambiar la ceniza por una corona, el luto por alegría y el espíritu triste por un manto de alabanza. Él transforma nuestro dolor."},{"libro":"Salmos","cap":"5","vers":"11","texto":"Pero alégrense todos los que en ti confían; den voces de júbilo para siempre, porque tú los defiendes.","explica":"El salmista invita a alegrarse a todos los que confían en Dios, porque Él los protege. La confianza en Dios produce alegría."},{"libro":"Mateo","cap":"25","vers":"40","texto":"De cierto os digo que en cuanto lo hicisteis a uno de estos mis hermanos más pequeños, a mí lo hicisteis.","explica":"Jesús dice que cuando ayudamos a alguien necesitado, a un enfermo o a un pobre, es como si lo hiciéramos con Él mismo. Cada acto de bondad es un regalo para Jesús."},{"libro":"Salmos","cap":"119","vers":"28","texto":"Se deshace mi alma de ansiedad; susténtame según tu palabra.","explica":"El salmista siente que su alma se deshace de tristeza y ansiedad, y pide a Dios que lo sostenga con su palabra. La Palabra de Dios nos levanta."},{"libro":"Juan","cap":"3","vers":"36","texto":"El que cree en el Hijo tiene vida eterna.","explica":"Quien cree en Jesús, el Hijo de Dios, tiene vida eterna. Es una promesa sencilla y segura para quien pone su fe en Él."},{"libro":"Salmos","cap":"40","vers":"11","texto":"Jehová, no retengas de mí tus misericordias; tu misericordia y tu verdad me guarden siempre.","explica":"David le pide a Dios que no le quite su misericordia, y que su amor y su verdad lo protejan siempre. Es una oración para cada día."},{"libro":"Proverbios","cap":"31","vers":"25","texto":"Fuerza y honor son su vestidura; y se ríe de lo por venir.","explica":"Este versículo describe a una mujer de Dios: vestida de fuerza y dignidad, que mira el futuro sin miedo, sonriendo. Así se ve una mujer que confía en Dios."},{"libro":"Salmos","cap":"27","vers":"13","texto":"Hubiera yo desmayado, si no creyese que veré la bondad de Jehová en la tierra de los vivientes.","explica":"David dice que se habría desanimado si no creyera que va a ver la bondad de Dios en esta vida. Su fe lo mantenía de pie: Dios es bueno aquí y ahora."},{"libro":"1 Corintios","cap":"2","vers":"9","texto":"Cosas que ojo no vio, ni oído oyó, ni han subido en corazón de hombre, son las que Dios ha preparado para los que le aman.","explica":"Lo que Dios ha preparado para los que lo aman es tan maravilloso que nadie lo ha visto ni oído ni imaginado. Lo mejor todavía está por venir."},{"libro":"Salmos","cap":"98","vers":"4","texto":"Cantad alegres a Jehová, toda la tierra; levantad la voz, y aplaudid, y cantad salmos.","explica":"Este salmo invita a toda la tierra a cantar, aplaudir y hacer música para Dios. Alabar a Dios es motivo de fiesta."},{"libro":"Isaías","cap":"40","vers":"11","texto":"Como pastor apacentará su rebaño; en su brazo llevará los corderos, y en su seno los llevará; pastoreará suavemente a las recién paridas.","explica":"Dios es como un pastor que lleva a los corderitos en sus brazos, junto a su pecho, y trata con cuidado a las que están débiles. Así de tierno es Dios con nosotros."},{"libro":"Salmos","cap":"121","vers":"5","texto":"Jehová es tu guardador; Jehová es tu sombra a tu mano derecha.","explica":"Dios es nuestro guardián y nuestra sombra, que nos protege del sol fuerte. Siempre está a nuestro lado derecho, cerquita."},{"libro":"Lucas","cap":"23","vers":"43","texto":"Entonces Jesús le dijo: De cierto te digo que hoy estarás conmigo en el paraíso.","explica":"Jesús le dijo esto al ladrón arrepentido que estaba crucificado a su lado. Aun en el último momento, Jesús lo perdonó y le prometió el paraíso. Nunca es tarde para Dios."},{"libro":"Salmos","cap":"31","vers":"19","texto":"¡Cuán grande es tu bondad, que has guardado para los que te temen!","explica":"David se maravilla de lo grande que es la bondad que Dios tiene guardada para los que lo aman. Dios tiene cosas buenas preparadas para nosotros."},{"libro":"Hebreos","cap":"6","vers":"19","texto":"La cual tenemos como segura y firme ancla del alma.","explica":"La esperanza en Dios es como el ancla de un barco: lo mantiene firme cuando hay tormenta. Con esa esperanza nuestra alma no se pierde."},{"libro":"Salmos","cap":"16","vers":"5","texto":"Jehová es la porción de mi herencia y de mi copa; tú sustentas mi suerte.","explica":"David dice que Dios es su herencia y su porción, lo mejor que le tocó en la vida. Y que su futuro está seguro en las manos de Dios."},{"libro":"Juan","cap":"14","vers":"21","texto":"El que me ama, será amado por mi Padre, y yo le amaré, y me manifestaré a él.","explica":"Jesús dice que quien guarda sus mandamientos lo ama, y que a quien lo ama, el Padre y Él lo amarán y se le mostrarán. Amar a Jesús es obedecerle."},{"libro":"Salmos","cap":"119","vers":"147","texto":"Me anticipé al alba, y clamé; esperé en tu palabra.","explica":"El salmista se levantaba antes del amanecer para orar y esperar en la Palabra de Dios. Las madrugadas son un momento especial para hablar con Dios."},{"libro":"Joel","cap":"2","vers":"26","texto":"Comeréis hasta saciaros, y alabaréis el nombre de Jehová vuestro Dios, el cual hizo maravillas con vosotros.","explica":"Dios promete a su pueblo que comerá hasta saciarse y alabará su nombre, porque Él hizo maravillas con ellos. Dios provee y merece nuestra gratitud."},{"libro":"Salmos","cap":"36","vers":"7","texto":"¡Cuán preciosa, oh Dios, es tu misericordia! Por eso los hijos de los hombres se amparan bajo la sombra de tus alas.","explica":"El amor de Dios es tan precioso que las personas se refugian bajo la sombra de sus alas, como los pollitos bajo su mamá. Ahí estamos seguros."},{"libro":"Mateo","cap":"5","vers":"5","texto":"Bienaventurados los mansos, porque ellos recibirán la tierra por heredad.","explica":"Los mansos son personas humildes y tranquilas, que no buscan pelear ni imponerse. Jesús dice que ellos heredarán la tierra. La humildad es grande ante Dios."},{"libro":"Salmos","cap":"57","vers":"1","texto":"Ten misericordia de mí, oh Dios, ten misericordia de mí; porque en ti ha confiado mi alma, y en la sombra de tus alas me ampararé.","explica":"David escribió esto escondido en una cueva, huyendo. Le pide a Dios misericordia y se refugia bajo la sombra de sus alas hasta que pase el peligro."},{"libro":"Romanos","cap":"15","vers":"4","texto":"Las cosas que se escribieron antes, para nuestra enseñanza se escribieron, a fin de que por la paciencia y la consolación de las Escrituras, tengamos esperanza.","explica":"Todo lo que está escrito en la Biblia fue escrito para enseñarnos y para que tengamos esperanza. Leer la Palabra de Dios nos da paciencia y consuelo."},{"libro":"Salmos","cap":"139","vers":"1-2","texto":"Oh Jehová, tú me has examinado y conocido. Tú has conocido mi sentarme y mi levantarme.","explica":"David dice que Dios lo conoce completamente: sabe cuándo se sienta y cuándo se levanta, y hasta lo que piensa. Dios te conoce mejor que nadie y te ama."},{"libro":"Proverbios","cap":"20","vers":"7","texto":"Camina en su integridad el justo; sus hijos son dichosos después de él.","explica":"El hombre justo que vive con integridad deja una bendición a sus hijos. Una vida honesta y fiel es la mejor herencia para la familia."},{"libro":"Salmos","cap":"101","vers":"1","texto":"Misericordia y juicio cantaré; a ti cantaré yo, oh Jehová.","explica":"David decide cantar de la misericordia y la justicia de Dios. Las dos van juntas: Dios es justo, pero también lleno de amor y perdón."},{"libro":"Isaías","cap":"52","vers":"7","texto":"¡Cuán hermosos son sobre los montes los pies del que trae alegres nuevas, del que anuncia la paz!","explica":"Isaías dice que son hermosos los pies de los que traen buenas noticias de paz y salvación. Compartir el amor de Dios con otros es algo hermoso."},{"libro":"Salmos","cap":"17","vers":"8","texto":"Guárdame como a la niña de tus ojos; escóndeme bajo la sombra de tus alas.","explica":"La niña de los ojos es la pupila, la parte del ojo que más cuidamos. David le pide a Dios que lo cuide así, con ese mismo cuidado, y que lo esconda bajo sus alas."},{"libro":"Juan","cap":"1","vers":"14","texto":"Y aquel Verbo fue hecho carne, y habitó entre nosotros, lleno de gracia y de verdad.","explica":"Jesús, que es la Palabra de Dios, se hizo hombre y vivió entre nosotros. Dios no se quedó lejos: vino a estar cerca, lleno de amor y de verdad."},{"libro":"Salmos","cap":"149","vers":"4","texto":"Porque Jehová tiene contentamiento en su pueblo; hermoseará a los humildes con la salvación.","explica":"A Dios le alegra su pueblo. Él se complace en nosotros y adorna a los humildes con salvación, como quien pone una joya."},{"libro":"1 Juan","cap":"5","vers":"14","texto":"Y esta es la confianza que tenemos en él, que si pedimos alguna cosa conforme a su voluntad, él nos oye.","explica":"Juan nos da confianza para orar: si pedimos algo que está de acuerdo con lo que Dios quiere, Él nos escucha. Dios atiende nuestras oraciones."},{"libro":"Salmos","cap":"119","vers":"174","texto":"He deseado tu salvación, oh Jehová, y tu ley es mi delicia.","explica":"El salmista desea la salvación de Dios y dice que la Palabra de Dios es su alegría. Leer y escuchar a Dios puede ser un gusto, no una obligación."},{"libro":"Mateo","cap":"6","vers":"9-10","texto":"Padre nuestro que estás en los cielos, santificado sea tu nombre. Venga tu reino. Hágase tu voluntad, como en el cielo, así también en la tierra.","explica":"Así empieza el Padre Nuestro, la oración que Jesús nos enseñó. Primero llamamos a Dios Padre, honramos su nombre y pedimos que se haga su voluntad. Es una oración para cada día."},{"libro":"Salmos","cap":"145","vers":"14","texto":"Sostiene Jehová a todos los que caen, y levanta a todos los oprimidos.","explica":"Dios sostiene a los que se caen y levanta a los que están agobiados. Si hoy te sientes caída o cansada, Dios extiende su mano para levantarte."},{"libro":"Isaías","cap":"65","vers":"24","texto":"Y antes que clamen, responderé yo; mientras aún hablan, yo habré oído.","explica":"Dios promete que antes de que lo llamemos, Él ya nos responde, y mientras todavía estamos hablando, Él ya escuchó. Dios está atento a nosotros."},{"libro":"Salmos","cap":"138","vers":"7","texto":"Si anduviere yo en medio de la angustia, tú me vivificarás; y me salvará tu diestra.","explica":"Aunque caminemos en medio de problemas, Dios nos da vida y nos salva con su mano derecha. Él no nos suelta en la dificultad."},{"libro":"Filipenses","cap":"2","vers":"13","texto":"Porque Dios es el que en vosotros produce así el querer como el hacer, por su buena voluntad.","explica":"Es Dios quien pone en nosotros el deseo de hacer el bien y la fuerza para hacerlo. No tenemos que lograrlo solos: Dios trabaja dentro de nosotros."},{"libro":"Salmos","cap":"91","vers":"15","texto":"Me invocará, y yo le responderé; con él estaré yo en la angustia; lo libraré y le glorificaré.","explica":"Dios promete: cuando me llame, le responderé; estaré con él en la angustia, lo libraré y lo honraré. Dios está con nosotros en los momentos difíciles."},{"libro":"Lucas","cap":"1","vers":"46-47","texto":"Engrandece mi alma al Señor; y mi espíritu se regocija en Dios mi Salvador.","explica":"Esta es la canción de María cuando supo que sería la madre de Jesús. Su alma engrandece a Dios y su espíritu se alegra. María nos enseña a alabar con alegría."},{"libro":"Salmos","cap":"91","vers":"16","texto":"Lo saciaré de larga vida, y le mostraré mi salvación.","explica":"Dios promete saciar con larga vida a quien confía en Él y mostrarle su salvación. Cada año de vida es un regalo de Dios."},{"libro":"Proverbios","cap":"9","vers":"10","texto":"El temor de Jehová es el principio de la sabiduría, y el conocimiento del Santísimo es la inteligencia.","explica":"La sabiduría verdadera empieza por respetar a Dios, y conocerlo a Él es la mayor inteligencia. Conocer a Dios es más valioso que cualquier estudio."},{"libro":"Salmos","cap":"117","vers":"1-2","texto":"Alabad a Jehová, naciones todas; pueblos todos, alabadle. Porque ha engrandecido sobre nosotros su misericordia, y la fidelidad de Jehová es para siempre.","explica":"Este es el salmo más corto de la Biblia. Invita a todas las naciones a alabar a Dios, porque su amor por nosotros es grande y su fidelidad dura para siempre."},{"libro":"Juan","cap":"11","vers":"40","texto":"Jesús le dijo: ¿No te he dicho que si crees, verás la gloria de Dios?","explica":"Antes de resucitar a Lázaro, Jesús le dijo a Marta: si crees, verás la gloria de Dios. La fe nos permite ver a Dios obrar aun donde parece que todo se acabó."},{"libro":"Salmos","cap":"73","vers":"28","texto":"Pero en cuanto a mí, el acercarme a Dios es el bien; he puesto en Jehová el Señor mi esperanza.","explica":"El salmista concluye que lo mejor para él es estar cerca de Dios. Por eso puso su esperanza en el Señor. Estar cerca de Dios es lo que más nos conviene."},{"libro":"Efesios","cap":"5","vers":"2","texto":"Y andad en amor, como también Cristo nos amó, y se entregó a sí mismo por nosotros.","explica":"Pablo nos pide vivir amando, igual que Cristo nos amó y se entregó por nosotros. El amor de Jesús es el modelo de cómo amar a los demás."},{"libro":"Salmos","cap":"146","vers":"8","texto":"Jehová abre los ojos a los ciegos; Jehová levanta a los caídos; Jehová ama a los justos.","explica":"Dios abre los ojos de los ciegos, levanta a los que están caídos y ama a los justos. Dios se preocupa por los que sufren."},{"libro":"Isaías","cap":"40","vers":"28","texto":"¿No has sabido, no has oído que el Dios eterno es Jehová, el cual creó los confines de la tierra? No desfallece, ni se fatiga con cansancio.","explica":"Dios nunca se cansa ni se agota. Él creó todo el mundo y su fuerza no tiene fin. Cuando nosotros estamos cansados, Él sigue fuerte para ayudarnos."},{"libro":"Salmos","cap":"42","vers":"1","texto":"Como el ciervo brama por las corrientes de las aguas, así clama por ti, oh Dios, el alma mía.","explica":"El ciervo con sed busca desesperado el agua del río. Así el salmista busca a Dios. Nuestra alma tiene sed de Dios, y solo Él la satisface."},{"libro":"Juan","cap":"14","vers":"13","texto":"Y todo lo que pidiereis al Padre en mi nombre, lo haré, para que el Padre sea glorificado en el Hijo.","explica":"Jesús promete que lo que pidamos al Padre en su nombre, Él lo hará, para que Dios sea glorificado. Orar en nombre de Jesús es orar con su autoridad y su amor."},{"libro":"Salmos","cap":"126","vers":"5","texto":"Los que sembraron con lágrimas, con regocijo segarán.","explica":"Los que siembran llorando cosecharán con alegría. Las lágrimas de hoy, cuando las ponemos en manos de Dios, se convierten en alegría mañana."},{"libro":"Hebreos","cap":"13","vers":"6","texto":"De manera que podemos decir confiadamente: El Señor es mi ayudador; no temeré lo que me pueda hacer el hombre.","explica":"Como Dios prometió no dejarnos, podemos decir con confianza: el Señor me ayuda, no tendré miedo. ¿Qué nos puede hacer el hombre si Dios está con nosotros?"},{"libro":"Salmos","cap":"134","vers":"3","texto":"Desde Sion te bendiga Jehová, el cual ha hecho los cielos y la tierra.","explica":"Esta es una bendición final: que el Señor, que hizo el cielo y la tierra, te bendiga. El mismo Dios que creó todo te bendice a ti."},{"libro":"Isaías","cap":"41","vers":"17","texto":"Los afligidos y menesterosos buscan las aguas, y no las hay; seca está de sed su lengua; yo Jehová los oiré, yo el Dios de Israel no los desampararé.","explica":"Cuando los pobres y necesitados buscan agua y no la encuentran, Dios promete responderles y no abandonarlos. Dios escucha a los que tienen necesidad."}];
const NOMBRE = "María Teresa";


const ahora = new Date();
const isoHoy = ahora.getFullYear() + "-" + String(ahora.getMonth() + 1).padStart(2, "0") + "-" + String(ahora.getDate()).padStart(2, "0");
const inicio = new Date(ahora.getFullYear(), 0, 0);
const diaDelAnio = Math.floor((ahora - inicio) / 86400000);
const v = VERSOS[(diaDelAnio - 1) % VERSOS.length];

const cita = v.libro + " " + v.cap + ":" + v.vers;
function citaHablada() {
  let l = v.libro;
  if (l.startsWith("1 ")) l = "Primera de " + l.slice(2);
  else if (l.startsWith("2 ")) l = "Segunda de " + l.slice(2);
  else if (l.startsWith("3 ")) l = "Tercera de " + l.slice(2);
  if (l === "Salmos") l = "Salmo";
  const vs = v.vers.includes("-") ? "versículos " + v.vers.replace("-", " al ") : "versículo " + v.vers;
  return l + ", capítulo " + v.cap + ", " + vs;
}

const h = ahora.getHours();
const saludo = h < 12 ? "Buenos días" : (h < 19 ? "Buenas tardes" : "Buenas noches");
const fechaTxt = ahora.toLocaleDateString("es", { weekday: "long", day: "numeric", month: "long" });

document.getElementById("notifNombre").textContent = NOMBRE;
document.getElementById("diaBloqueo").textContent = fechaTxt.charAt(0).toUpperCase() + fechaTxt.slice(1);
document.getElementById("notifTexto").textContent = "«" + v.texto + "» — " + cita;
document.getElementById("saludo").textContent = saludo + ",\n" + NOMBRE + " " + (h < 12 ? "☀️" : (h < 19 ? "🌤" : "🌙"));
document.getElementById("fecha").textContent = fechaTxt.charAt(0).toUpperCase() + fechaTxt.slice(1);
document.getElementById("verso").textContent = "«" + v.texto + "»";
document.getElementById("cita").textContent = cita;
document.getElementById("explica").textContent = v.explica || "";
document.getElementById("cajaExplica").hidden = !v.explica;

// ---------- Voz ----------
const btn = document.getElementById("btn");
const avisoVoz = document.getElementById("avisoVoz");
const voz = window.speechSynthesis;
let hablando = false;

function elegirVoz() {
  const voces = voz ? voz.getVoices() : [];
  const pref = ["es-MX", "es-US", "es-CO", "es-ES"];
  for (const p of pref) {
    const x = voces.find(z => z.lang && z.lang.replace("_", "-").toLowerCase() === p.toLowerCase());
    if (x) return x;
  }
  return voces.find(z => z.lang && z.lang.toLowerCase().startsWith("es")) || null;
}

function ponerBoton(parar) {
  hablando = parar;
  btn.textContent = parar ? "⏹  Parar" : "🔊  Escuchar";
  btn.classList.toggle("parar", parar);
}

function frase(t) {
  const u = new SpeechSynthesisUtterance(t);
  u.lang = "es-MX";
  const elegida = elegirVoz();
  if (elegida) u.voice = elegida;
  u.rate = 0.85;
  return u;
}

function hablar() {
  if (!voz) {
    avisoVoz.textContent = "Este navegador no tiene voz. En la app de Android sí habla.";
    avisoVoz.hidden = false;
    return;
  }
  voz.cancel();
  const s = saludo + ", " + NOMBRE + ".";
  const partes = [s + " Este es tu versículo de hoy.", citaHablada() + ".", v.texto];
  if (v.explica) partes.push("Lo que nos quiere decir este versículo.", v.explica);
  partes.push("Que Dios te bendiga hoy. Te quiero mucho.");
  partes.forEach((t, i) => {
    const u = frase(t);
    if (i === 0) u.onstart = () => ponerBoton(true);
    if (i === partes.length - 1) u.onend = () => ponerBoton(false);
    u.onerror = () => ponerBoton(false);
    voz.speak(u);
  });
}

function parar() { if (voz) voz.cancel(); ponerBoton(false); }

btn.addEventListener("click", () => hablando ? parar() : hablar());
if (voz) voz.onvoiceschanged = () => {};

document.getElementById("notif").addEventListener("click", () => {
  document.getElementById("bloqueo").hidden = true;
  document.getElementById("app").hidden = false;
  window.scrollTo(0, 0);
  hablar(); // se abre y empieza a hablar sola, como en la app
});
document.getElementById("volver").addEventListener("click", () => {
  parar();
  document.getElementById("app").hidden = true;
  document.getElementById("bloqueo").hidden = false;
});
</script>
