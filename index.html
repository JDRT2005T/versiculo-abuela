<title>Versículo del Día</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&family=Nunito:wght@400;600;800&display=swap">
<style>
/* Layout: una sola pantalla de teléfono; primero la pantalla de bloqueo con el aviso, luego la app tal cual se ve en Android. */
:root {
  --papel: #FFF8EC;      /* fondo de la app */
  --tinta: #222222;      /* texto del versículo */
  --azul: #2E4A7D;       /* saludo, cita, barra */
  --oro: #E0A82E;        /* cruz */
  --verde: #2E8B57;      /* botón escuchar */
  --rojo: #C0392B;       /* botón parar */
  --suave: #8A7A62;      /* textos secundarios */
  --noche1: #1B2A4A;     /* pantalla de bloqueo */
  --noche2: #4A3A5E;
  --f-verso: "Literata", Georgia, "Times New Roman", serif;
  --f-ui: "Nunito", "Segoe UI", Roboto, system-ui, sans-serif;
  color-scheme: light;
}
html, body { height: 100%; }
body { margin: 0; overflow-x: hidden; }
[hidden] { display: none !important; }
body {
  background: var(--papel);
  color: var(--tinta);
  font-family: var(--f-ui);
  -webkit-tap-highlight-color: transparent;
}

/* ---------- Pantalla de bloqueo ---------- */
#bloqueo {
  min-height: 100%;
  box-sizing: border-box;
  background: linear-gradient(170deg, var(--noche1) 0%, var(--noche2) 70%, #8A5A4A 100%);
  color: #fff;
  display: flex; flex-direction: column; align-items: center;
  padding: 48px 16px 32px;
  gap: 8px;
}
#bloqueo .hora { font-size: 84px; font-weight: 600; letter-spacing: -2px; line-height: 1; font-variant-numeric: tabular-nums; }
#bloqueo .dia { font-size: 18px; opacity: .85; }
.notif {
  margin-top: 40px;
  width: 100%; max-width: 440px;
  box-sizing: border-box;
  text-align: left;
  background: rgba(255,255,255,.92);
  color: var(--tinta);
  border: 0; border-radius: 22px;
  padding: 14px 16px 16px;
  font: inherit;
  box-shadow: 0 10px 30px rgba(0,0,0,.25);
  cursor: pointer;
  animation: llega .7s cubic-bezier(.2,.9,.3,1.2) .4s both;
}
.notif:focus-visible { outline: 3px solid var(--oro); outline-offset: 3px; }
.notif .app { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--suave); }
.notif .app svg { width: 20px; height: 20px; flex: none; }
.notif .app .cuando { margin-left: auto; }
.notif .tit { font-weight: 800; font-size: 18px; margin-top: 8px; }
.notif .cuerpo { font-size: 16px; margin-top: 4px; line-height: 1.4; }
.notif .accion { margin-top: 12px; font-weight: 800; color: var(--azul); font-size: 15px; letter-spacing: .04em; }
.pista { margin-top: auto; padding-top: 32px; font-size: 15px; opacity: .8; text-align: center; animation: late 2s ease-in-out infinite; }
@keyframes llega { from { transform: translateY(-40px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes late { 50% { opacity: .4; } }

/* ---------- App ---------- */
#app { min-height: 100%; display: flex; flex-direction: column; }
.barra { height: 8px; background: var(--azul); }
.cont {
  flex: 1;
  width: 100%; max-width: 560px; margin: 0 auto;
  box-sizing: border-box;
  padding: 28px 20px 20px;
  display: flex; flex-direction: column; align-items: center; gap: 0;
  text-align: center;
}
.saludo { white-space: pre-line; font-size: 30px; font-weight: 800; color: var(--azul); margin: 0; text-wrap: balance; }
.fecha { font-size: 20px; color: #6B5B45; margin: 4px 0 22px; }
.tarjeta {
  width: 100%; box-sizing: border-box;
  background: #fff; border-radius: 22px;
  padding: 26px 22px;
  box-shadow: 0 3px 10px rgba(46,74,125,.12);
}
.cruz { color: var(--oro); font-size: 34px; line-height: 1; }
.verso { font-family: var(--f-verso); font-size: 27px; line-height: 1.45; margin: 12px 0 16px; text-wrap: pretty; }
.cita { font-size: 24px; font-weight: 800; color: var(--azul); }
.escuchar {
  margin-top: 28px;
  width: 100%; height: 110px;
  border: 0; border-radius: 26px;
  background: var(--verde); color: #fff;
  font: 800 32px var(--f-ui);
  box-shadow: 0 4px 0 rgba(0,0,0,.18);
  cursor: pointer;
  transition: transform .08s, background-color .2s;
}
.escuchar:active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(0,0,0,.18); }
.escuchar:focus-visible { outline: 4px solid var(--oro); outline-offset: 3px; }
.escuchar.parar { background: var(--rojo); }
.explica { width: 100%; box-sizing: border-box; margin-top: 24px; background: #F3E7CF; border-radius: 22px; padding: 20px 22px 22px; text-align: left; }
.explica h2 { margin: 0; font-size: 23px; font-weight: 800; color: var(--azul); }
.explica p { margin: 10px 0 0; font-size: 22px; line-height: 1.5; color: #3A3226; }
.info { font-size: 17px; color: var(--suave); margin: 24px 0 8px; }
.aviso-voz { font-size: 15px; color: var(--rojo); margin: 8px 0 0; }
.pie { margin-top: auto; padding-top: 20px; display: flex; flex-direction: column; gap: 6px; align-items: center; }
.pie button {
  background: none; border: 0; font: 600 14px var(--f-ui); color: var(--suave);
  text-decoration: underline; cursor: pointer; padding: 8px;
}
.etiqueta { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: #B0A28A; }
@media (prefers-reduced-motion: reduce) { .notif, .pista { animation: none; } .escuchar { transition: none; } }
</style>

<section id="bloqueo" aria-label="Pantalla de bloqueo del celular">
  <div class="hora">6:00</div>
  <div class="dia" id="diaBloqueo"></div>
  <button class="notif" id="notif" type="button" aria-label="Abrir el versículo de hoy">
    <div class="app">
      <svg viewBox="0 0 108 108" aria-hidden="true"><circle cx="54" cy="54" r="50" fill="#2E4A7D"/><path fill="#FFF6DD" d="M54 40C44 33 30 32 22 34v44c8-2 22-1 32 6z"/><path fill="#FFEFC2" d="M54 40c10-7 24-8 32-6v44c-8-2-22-1-32 6z"/><path fill="#E0A82E" d="M52.5 40h3v44h-3zM51 14h6v8h7v6h-7v8h-6v-8h-7v-6h7z"/></svg>
      <span>Versículo del Día</span><span class="cuando">ahora</span>
    </div>
    <div class="tit">🙏 <span id="notifNombre"></span>, tu versículo de hoy</div>
    <div class="cuerpo" id="notifTexto"></div>
    <div class="accion">🔊 ESCUCHAR</div>
  </button>
  <div class="pista">Toca la notificación, como lo haría la abuela 👆</div>
</section>

<section id="app" hidden aria-label="La app">
  <div class="barra"></div>
  <div class="cont">
    <h1 class="saludo" id="saludo"></h1>
    <p class="fecha" id="fecha"></p>
    <div class="tarjeta">
      <div class="cruz" aria-hidden="true">✝</div>
      <p class="verso" id="verso"></p>
      <div class="cita" id="cita"></div>
    </div>
    <button class="escuchar" id="btn" type="button">🔊  Escuchar</button>
    <p class="aviso-voz" id="avisoVoz" hidden></p>
    <div class="explica" id="cajaExplica">
      <h2>💡 ¿Qué nos quiere decir?</h2>
      <p id="explica"></p>
    </div>
    <p class="info">Cada mañana a las 6:00 te leo un versículo nuevo 🌅</p>
    <div class="pie">
      <span class="etiqueta">Muestra para ver en el iPhone</span>
      <button type="button" id="volver">Ver otra vez la notificación</button>
    </div>
  </div>
</section>

<script>
const VERSOS = [{"libro":"Juan","cap":"3","vers":"16","texto":"Porque de tal manera amó Dios al mundo, que ha dado a su Hijo unigénito, para que todo aquel que en él cree, no se pierda, mas tenga vida eterna.","explica":"Este es el versículo más conocido de la Biblia. Nos dice que Dios nos ama tanto que entregó a su propio Hijo, Jesús, por nosotros. No hay que ganarse ese amor: solo creer en Jesús. Y la promesa es grande: una vida que no se acaba, con Dios para siempre."},{"libro":"Salmos","cap":"23","vers":"1","texto":"Jehová es mi pastor; nada me faltará.","explica":"Un pastor cuida a sus ovejas: les busca comida, agua y las protege. Aquí David dice que Dios hace eso con nosotros. Si Dios nos cuida, no tenemos que vivir con miedo de que algo nos falte."},{"libro":"Filipenses","cap":"4","vers":"13","texto":"Todo lo puedo en Cristo que me fortalece.","explica":"Pablo escribió esto estando preso. No quiere decir que podemos hacer cualquier cosa que se nos ocurra, sino que con la ayuda de Cristo podemos aguantar lo bueno y lo malo. Cuando nos sentimos sin fuerzas, Él nos da las fuerzas que necesitamos."},{"libro":"Isaías","cap":"41","vers":"10","texto":"No temas, porque yo estoy contigo; no desmayes, porque yo soy tu Dios que te esfuerzo; siempre te ayudaré, siempre te sustentaré con la diestra de mi justicia.","explica":"Dios le habla a su pueblo cuando estaba asustado y lejos de casa. Le dice tres cosas: estoy contigo, soy tu Dios y te voy a sostener. Hoy esas mismas palabras son para ti. No estás sola: Dios te tiene agarrada de la mano."},{"libro":"Jeremías","cap":"29","vers":"11","texto":"Porque yo sé los pensamientos que tengo acerca de vosotros, dice Jehová, pensamientos de paz, y no de mal, para daros el fin que esperáis.","explica":"Dios dijo esto a un pueblo que vivía tiempos muy difíciles. Les recordó que Él tiene buenos planes, planes de paz y no de mal. Aunque a veces no entendamos lo que pasa, Dios sabe a dónde nos lleva y nos espera un buen final."},{"libro":"Proverbios","cap":"3","vers":"5-6","texto":"Fíate de Jehová de todo tu corazón, y no te apoyes en tu propia prudencia. Reconócelo en todos tus caminos, y él enderezará tus veredas.","explica":"Confiar con todo el corazón es dejar las cosas en manos de Dios, aunque no lo entendamos todo. Nuestra propia sabiduría tiene límites. Si le damos a Dios el primer lugar en todo, Él nos muestra el camino correcto."},{"libro":"Romanos","cap":"8","vers":"28","texto":"Y sabemos que a los que aman a Dios, todas las cosas les ayudan a bien, esto es, a los que conforme a su propósito son llamados.","explica":"No dice que todo lo que pasa es bueno, sino que Dios puede sacar algo bueno de todo, incluso de lo difícil. Para quienes aman a Dios, nada se desperdicia: Él lo usa todo para nuestro bien."},{"libro":"Mateo","cap":"11","vers":"28","texto":"Venid a mí todos los que estáis trabajados y cargados, y yo os haré descansar.","explica":"Jesús invita a todos los cansados, de cuerpo o de alma. No pide que primero estemos bien: dice \"venid como estéis\". Cuando le contamos nuestras cargas en oración, Él nos da descanso de verdad."},{"libro":"Salmos","cap":"46","vers":"1","texto":"Dios es nuestro amparo y fortaleza, nuestro pronto auxilio en las tribulaciones.","explica":"Un amparo es un lugar seguro donde uno se refugia de la tormenta. El salmista dice que Dios es ese lugar, y que su ayuda llega pronto. En los momentos de angustia, Dios no está lejos: está cerca y listo para ayudar."},{"libro":"Josué","cap":"1","vers":"9","texto":"Mira que te mando que te esfuerces y seas valiente; no temas ni desmayes, porque Jehová tu Dios estará contigo en dondequiera que vayas.","explica":"Dios le dijo esto a Josué cuando le tocaba guiar a todo el pueblo después de Moisés, una tarea que le daba miedo. El secreto para ser valiente no es no tener miedo, sino saber que Dios va con nosotros a todas partes."},{"libro":"Salmos","cap":"121","vers":"1-2","texto":"Alzaré mis ojos a los montes; ¿de dónde vendrá mi socorro? Mi socorro viene de Jehová, que hizo los cielos y la tierra.","explica":"El que escribió esto miraba los montes y se preguntaba de dónde le vendría la ayuda. Y se respondió: del mismo Dios que hizo el cielo y la tierra. Si Dios pudo hacer todo eso, puede ayudarnos en lo que necesitemos hoy."},{"libro":"Lamentaciones","cap":"3","vers":"22-23","texto":"Por la misericordia de Jehová no hemos sido consumidos, porque nunca decayeron sus misericordias. Nuevas son cada mañana; grande es tu fidelidad.","explica":"Jeremías escribió esto en un momento muy triste, viendo su ciudad destruida. Aun así recordó que el amor de Dios no se acaba. Cada mañana Dios nos da un amor y una misericordia nuevos. Hoy es un día nuevo para empezar con Él."},{"libro":"Filipenses","cap":"4","vers":"6-7","texto":"Por nada estéis afanosos, sino sean conocidas vuestras peticiones delante de Dios en toda oración y ruego, con acción de gracias. Y la paz de Dios, que sobrepasa todo entendimiento, guardará vuestros corazones y vuestros pensamientos en Cristo Jesús.","explica":"Pablo nos enseña qué hacer con las preocupaciones: convertirlas en oración. Contarle todo a Dios y darle gracias. A cambio, Dios nos da una paz tan grande que ni nosotros mismos la entendemos, y esa paz cuida nuestro corazón."},{"libro":"Salmos","cap":"118","vers":"24","texto":"Este es el día que hizo Jehová; nos gozaremos y alegraremos en él.","explica":"Cada día es un regalo que Dios hace. Este versículo nos invita a recibir el día de hoy con alegría, no por lo que va a pasar, sino porque Dios nos lo dio. Hoy también hay motivos para dar gracias."},{"libro":"Isaías","cap":"40","vers":"31","texto":"Pero los que esperan a Jehová tendrán nuevas fuerzas; levantarán alas como las águilas; correrán, y no se cansarán; caminarán, y no se fatigarán.","explica":"Las águilas no vuelan a puro aleteo: aprovechan el viento para subir alto. Así nos pasa cuando esperamos en Dios: Él nos da fuerzas nuevas que no son nuestras. Aunque nos sintamos cansados, con Dios podemos seguir adelante."},{"libro":"Juan","cap":"14","vers":"27","texto":"La paz os dejo, mi paz os doy; yo no os la doy como el mundo la da. No se turbe vuestro corazón, ni tenga miedo.","explica":"Jesús dijo esto a sus discípulos antes de morir, cuando ellos estaban asustados. La paz que el mundo da depende de que todo salga bien. La paz de Jesús es distinta: se queda con nosotros aunque las cosas estén difíciles."},{"libro":"Salmos","cap":"27","vers":"1","texto":"Jehová es mi luz y mi salvación; ¿de quién temeré? Jehová es la fortaleza de mi vida; ¿de quién he de atemorizarme?","explica":"David compara a Dios con una luz en la oscuridad y con una fortaleza segura. Si Dios es nuestra luz y nuestra protección, no hay nada que deba asustarnos. Este versículo es para repetirlo cuando sentimos miedo."},{"libro":"1 Pedro","cap":"5","vers":"7","texto":"Echando toda vuestra ansiedad sobre él, porque él tiene cuidado de vosotros.","explica":"Ansiedad es esa preocupación que no nos deja tranquilos. Pedro nos dice que se la podemos \"echar\" a Dios, como quien suelta una carga pesada. ¿Por qué? Porque a Dios le importamos de verdad y Él se encarga."},{"libro":"Mateo","cap":"6","vers":"33","texto":"Mas buscad primeramente el reino de Dios y su justicia, y todas estas cosas os serán añadidas.","explica":"Jesús hablaba de las preocupaciones por la comida y la ropa. Nos enseña que si ponemos a Dios primero en nuestra vida, Él se encarga de darnos lo demás que necesitamos. Lo primero es Dios; lo demás viene por añadidura."},{"libro":"Salmos","cap":"91","vers":"1-2","texto":"El que habita al abrigo del Altísimo morará bajo la sombra del Omnipotente. Diré yo a Jehová: Esperanza mía, y castillo mío; mi Dios, en quien confiaré.","explica":"Morar bajo la sombra del Omnipotente es vivir cerca de Dios, como bajo un techo que nos protege. Quien vive así puede decirle a Dios: \"Tú eres mi esperanza y mi castillo\". Es una oración para hacer con confianza."},{"libro":"Números","cap":"6","vers":"24-26","texto":"Jehová te bendiga, y te guarde; Jehová haga resplandecer su rostro sobre ti, y tenga de ti misericordia; Jehová alce sobre ti su rostro, y ponga en ti paz.","explica":"Esta es la bendición que Dios mandó a los sacerdotes decir sobre su pueblo. Pide que Dios nos cuide, nos mire con cariño, tenga compasión de nosotros y nos dé paz. Hoy es una bendición para ti, abuela."},{"libro":"Salmos","cap":"37","vers":"4","texto":"Deléitate asimismo en Jehová, y él te concederá las peticiones de tu corazón.","explica":"Deleitarse en Dios es disfrutar de estar con Él, como se disfruta de un ser querido. Cuando Dios es nuestra alegría, nuestros deseos se parecen cada vez más a los suyos, y Él con gusto nos los concede."},{"libro":"Juan","cap":"14","vers":"6","texto":"Jesús le dijo: Yo soy el camino, y la verdad, y la vida; nadie viene al Padre, sino por mí.","explica":"Tomás le preguntó a Jesús cómo conocer el camino al cielo. Jesús le respondió que Él mismo es el camino. No hace falta adivinar ni buscar por otro lado: siguiendo a Jesús llegamos a Dios Padre."},{"libro":"Romanos","cap":"15","vers":"13","texto":"Y el Dios de esperanza os llene de todo gozo y paz en el creer, para que abundéis en esperanza por el poder del Espíritu Santo.","explica":"Pablo pide que Dios nos llene de alegría y paz cuando confiamos en Él. Es como un vaso que se llena hasta rebosar. La esperanza no la sacamos de nosotros mismos: nos la da el Espíritu Santo."},{"libro":"Salmos","cap":"34","vers":"8","texto":"Gustad, y ved que es bueno Jehová; dichoso el hombre que confía en él.","explica":"\"Gustad y ved\" es como cuando alguien nos dice \"prueba esta comida, está buena\". David nos invita a probar por nosotros mismos lo bueno que es Dios. Quien confía en Él descubre que es feliz."},{"libro":"2 Corintios","cap":"12","vers":"9","texto":"Y me ha dicho: Bástate mi gracia; porque mi poder se perfecciona en la debilidad.","explica":"Pablo le pidió a Dios que le quitara un sufrimiento, y Dios le respondió esto. A veces Dios no quita la dificultad, pero nos da su gracia para soportarla. Cuando nos sentimos débiles es cuando más se ve su poder en nosotros."},{"libro":"Salmos","cap":"55","vers":"22","texto":"Echa sobre Jehová tu carga, y él te sustentará; no dejará para siempre caído al justo.","explica":"Una carga pesada no hay que llevarla sola. David nos dice que la pongamos sobre Dios, y Él nos sostendrá. Puede que tropecemos, pero Dios no deja que quien confía en Él se quede caído para siempre."},{"libro":"Hebreos","cap":"13","vers":"5","texto":"Sean vuestras costumbres sin avaricia, contentos con lo que tenéis ahora; porque él dijo: No te desampararé, ni te dejaré.","explica":"El autor nos invita a estar contentos con lo que tenemos y no vivir pendientes del dinero. ¿Por qué? Porque tenemos algo mucho mejor: la promesa de Dios de que nunca nos va a dejar solos."},{"libro":"Salmos","cap":"119","vers":"105","texto":"Lámpara es a mis pies tu palabra, y lumbrera a mi camino.","explica":"Antes no había luz eléctrica, y de noche se caminaba con una lámpara pequeña que alumbraba solo los pies. Así es la Palabra de Dios: nos alumbra paso a paso para no tropezar en el camino de la vida."},{"libro":"Isaías","cap":"26","vers":"3","texto":"Tú guardarás en completa paz a aquel cuyo pensamiento en ti persevera; porque en ti ha confiado.","explica":"Dios promete una paz completa a quien mantiene su pensamiento en Él. Cuando la mente se llena de preocupaciones, nos inquietamos; cuando la llenamos de confianza en Dios, viene la calma."},{"libro":"Juan","cap":"11","vers":"25","texto":"Le dijo Jesús: Yo soy la resurrección y la vida; el que cree en mí, aunque esté muerto, vivirá.","explica":"Jesús le dijo esto a Marta cuando su hermano Lázaro había muerto, y después lo resucitó. Nos enseña que para quien cree en Jesús, la muerte no es el final. Con Él hay vida que no termina."},{"libro":"Salmos","cap":"103","vers":"2","texto":"Bendice, alma mía, a Jehová, y no olvides ninguno de sus beneficios.","explica":"David le habla a su propia alma y le dice: no te olvides de todo lo bueno que Dios ha hecho. Es fácil fijarnos en lo que falta. Hoy es un buen día para recordar y agradecer todas las bendiciones recibidas."},{"libro":"Romanos","cap":"8","vers":"38-39","texto":"Por lo cual estoy seguro de que ni la muerte, ni la vida, ni ángeles, ni principados, ni potestades, ni lo presente, ni lo por venir, ni lo alto, ni lo profundo, ni ninguna otra cosa creada nos podrá separar del amor de Dios, que es en Cristo Jesús Señor nuestro.","explica":"Pablo hace una lista de todo lo que se le ocurre: la muerte, la vida, lo de hoy, lo de mañana. Y concluye que nada, absolutamente nada, puede separarnos del amor de Dios. Ese amor es para siempre."},{"libro":"Mateo","cap":"28","vers":"20","texto":"Y he aquí yo estoy con vosotros todos los días, hasta el fin del mundo.","explica":"Estas son de las últimas palabras de Jesús antes de subir al cielo. Prometió estar con nosotros todos los días, no solo los días buenos. Hoy también está contigo, abuela."},{"libro":"Salmos","cap":"16","vers":"11","texto":"Me mostrarás la senda de la vida; en tu presencia hay plenitud de gozo; delicias a tu diestra para siempre.","explica":"David dice que Dios le muestra el camino de la vida. Y que estar con Dios es la mayor alegría que existe, una alegría completa que no se acaba. La verdadera felicidad está cerca de Él."},{"libro":"Proverbios","cap":"18","vers":"10","texto":"Torre fuerte es el nombre de Jehová; a él correrá el justo, y será levantado.","explica":"Antiguamente las ciudades tenían torres fuertes donde la gente corría a protegerse. Este versículo dice que el nombre de Dios es como esa torre: cuando llamamos a Dios, encontramos protección."},{"libro":"Sofonías","cap":"3","vers":"17","texto":"Jehová está en medio de ti, poderoso, él salvará; se gozará sobre ti con alegría, callará de amor, se regocijará sobre ti con cánticos.","explica":"Este versículo nos muestra a un Dios que se alegra por nosotros y hasta canta de gozo, como una madre que canta a su bebé. Dios no solo nos tolera: nos ama con ternura y se goza en nosotros."},{"libro":"Salmos","cap":"139","vers":"14","texto":"Te alabaré; porque formidables, maravillosas son tus obras; estoy maravillado, y mi alma lo sabe muy bien.","explica":"David se maravilla de cómo Dios lo formó. Cada persona es una obra hecha con cuidado por Dios. Este versículo nos recuerda que tenemos valor, porque Dios nos hizo con amor."},{"libro":"Juan","cap":"10","vers":"11","texto":"Yo soy el buen pastor; el buen pastor su vida da por las ovejas.","explica":"Jesús se compara con un buen pastor que no huye cuando viene el lobo, sino que defiende a sus ovejas hasta dar la vida. Eso hizo Jesús por nosotros en la cruz. Somos sus ovejas y nos cuida."},{"libro":"Salmos","cap":"23","vers":"4","texto":"Aunque ande en valle de sombra de muerte, no temeré mal alguno, porque tú estarás conmigo; tu vara y tu cayado me infundirán aliento.","explica":"El valle de sombra de muerte son los momentos más oscuros y tristes de la vida. David dice que aun ahí no tiene miedo, porque Dios camina a su lado. La vara y el cayado eran lo que usaba el pastor para guiar y defender."},{"libro":"Isaías","cap":"43","vers":"2","texto":"Cuando pases por las aguas, yo estaré contigo; y si por los ríos, no te anegarán. Cuando pases por el fuego, no te quemarás, ni la llama arderá en ti.","explica":"Dios no promete que no pasaremos por aguas o fuego, es decir, por pruebas difíciles. Lo que promete es que estará con nosotros en medio de ellas, y que no nos van a destruir."},{"libro":"1 Juan","cap":"4","vers":"19","texto":"Nosotros le amamos a él, porque él nos amó primero.","explica":"Nuestro amor por Dios es una respuesta. Él nos amó primero, antes de que hiciéramos nada bueno. Cuando entendemos cuánto nos ama, el corazón le responde con amor."},{"libro":"Salmos","cap":"62","vers":"1-2","texto":"En Dios solamente está acallada mi alma; de él viene mi salvación. Él solamente es mi roca y mi salvación; es mi refugio, no resbalaré mucho.","explica":"Acallada significa tranquila, en silencio. David encuentra calma solo en Dios, porque Dios es como una roca firme que no se mueve. Cuando todo tiembla alrededor, Él sigue siendo nuestro apoyo seguro."},{"libro":"Mateo","cap":"5","vers":"14","texto":"Vosotros sois la luz del mundo; una ciudad asentada sobre un monte no se puede esconder.","explica":"Jesús dice que sus seguidores son como una luz que todos pueden ver. Con nuestro amor, nuestra bondad y nuestra fe, alumbramos a los que están cerca. Tu vida, abuela, ha sido luz para tu familia."},{"libro":"Gálatas","cap":"6","vers":"9","texto":"No nos cansemos, pues, de hacer bien; porque a su tiempo segaremos, si no desmayamos.","explica":"A veces hacemos el bien y parece que no sirve de nada. Pablo nos anima a no cansarnos, porque como el agricultor que siembra, a su tiempo llegará la cosecha. Ningún bien que hacemos se pierde."},{"libro":"Salmos","cap":"28","vers":"7","texto":"Jehová es mi fortaleza y mi escudo; en él confió mi corazón, y fui ayudado, por lo que se gozó mi corazón, y con mi cántico le alabaré.","explica":"David cuenta su experiencia: confió en Dios y Dios lo ayudó. Por eso su corazón está alegre y quiere cantarle. Cuando recordamos cómo Dios nos ha ayudado antes, nos dan ganas de alabarle."},{"libro":"Efesios","cap":"2","vers":"8","texto":"Porque por gracia sois salvos por medio de la fe; y esto no de vosotros, pues es don de Dios.","explica":"La salvación es un regalo de Dios. No la ganamos por portarnos bien ni por nuestro esfuerzo. Dios nos la da por su gracia, que es su amor que no merecemos, y la recibimos creyendo."},{"libro":"Salmos","cap":"145","vers":"18","texto":"Cercano está Jehová a todos los que le invocan, a todos los que le invocan de veras.","explica":"Dios no está lejos ni ocupado para escucharnos. Está cerca de todos los que lo llaman de corazón. No hacen falta palabras bonitas: basta con hablarle con sinceridad."},{"libro":"Deuteronomio","cap":"31","vers":"8","texto":"Y Jehová va delante de ti; él estará contigo, no te dejará, ni te desamparará; no temas ni te intimides.","explica":"Moisés le dijo esto a Josué antes de entrar a una tierra nueva. Dios no solo va con nosotros: va delante, preparando el camino. Por eso no hay que tener miedo de lo que viene."},{"libro":"Juan","cap":"15","vers":"5","texto":"Yo soy la vid, vosotros los pámpanos; el que permanece en mí, y yo en él, éste lleva mucho fruto; porque separados de mí nada podéis hacer.","explica":"Una rama separada de la planta se seca. Jesús dice que Él es la planta y nosotros las ramas. Si nos mantenemos unidos a Él, con oración y con su Palabra, nuestra vida da buenos frutos."},{"libro":"Salmos","cap":"32","vers":"8","texto":"Te haré entender, y te enseñaré el camino en que debes andar; sobre ti fijaré mis ojos.","explica":"Dios promete enseñarnos el camino que debemos seguir y no quitarnos los ojos de encima. Es como un padre que guía a su hijo con la mirada. Nunca caminamos sin su cuidado."},{"libro":"1 Tesalonicenses","cap":"5","vers":"16-18","texto":"Estad siempre gozosos. Orad sin cesar. Dad gracias en todo, porque esta es la voluntad de Dios para con vosotros en Cristo Jesús.","explica":"Pablo da tres consejos cortos: estar alegres, orar siempre y dar gracias en todo. Orar sin cesar es vivir conversando con Dios durante el día. Dar gracias en todo nos ayuda a ver lo bueno aun en días difíciles."},{"libro":"Salmos","cap":"100","vers":"4-5","texto":"Entrad por sus puertas con acción de gracias, por sus atrios con alabanza; alabadle, bendecid su nombre. Porque Jehová es bueno; para siempre es su misericordia, y su verdad por todas las generaciones.","explica":"Este salmo se cantaba al entrar al templo. Nos enseña a acercarnos a Dios dando gracias. ¿Por qué? Porque Dios es bueno, su amor no se acaba y es fiel con cada generación: con tus padres, contigo, con tus hijos y nietos."},{"libro":"Isaías","cap":"54","vers":"10","texto":"Porque los montes se moverán, y los collados temblarán, pero no se apartará de ti mi misericordia, ni el pacto de mi paz se quebrantará, dijo Jehová, el que tiene misericordia de ti.","explica":"Los montes parecen lo más firme que existe. Pero Dios dice que aunque los montes se movieran, su amor por nosotros no se va a mover. Su amor es más firme que cualquier cosa de este mundo."},{"libro":"Mateo","cap":"6","vers":"34","texto":"Así que, no os afanéis por el día de mañana, porque el día de mañana traerá su afán. Basta a cada día su propio mal.","explica":"Jesús nos enseña a vivir un día a la vez. Preocuparse por el mañana no lo cambia, solo nos quita la paz de hoy. Cada día trae lo suyo, y Dios nos da fuerzas para cada día."},{"libro":"Salmos","cap":"4","vers":"8","texto":"En paz me acostaré, y asimismo dormiré; porque solo tú, Jehová, me haces vivir confiado.","explica":"David podía dormir tranquilo aun en tiempos de peligro, porque sabía que Dios lo cuidaba. Es una buena oración para antes de dormir: dejar todo en manos de Dios y descansar en paz."},{"libro":"2 Timoteo","cap":"1","vers":"7","texto":"Porque no nos ha dado Dios espíritu de cobardía, sino de poder, de amor y de dominio propio.","explica":"Pablo le recordó a Timoteo, que era tímido, que el Espíritu de Dios no nos hace miedosos. Nos da poder para enfrentar las cosas, amor para tratar a los demás y dominio propio para controlarnos."},{"libro":"Salmos","cap":"34","vers":"18","texto":"Cercano está Jehová a los quebrantados de corazón; y salva a los contritos de espíritu.","explica":"Cuando el corazón está roto por la tristeza, Dios no se aleja: se acerca más. Este versículo es un consuelo para los días de dolor. Dios está especialmente cerca de los que sufren."},{"libro":"Juan","cap":"8","vers":"12","texto":"Otra vez Jesús les habló, diciendo: Yo soy la luz del mundo; el que me sigue, no andará en tinieblas, sino que tendrá la luz de la vida.","explica":"Jesús dice que Él es la luz del mundo. Así como sin luz uno tropieza en la oscuridad, sin Jesús la vida se vuelve confusa. Quien lo sigue tiene luz para ver el camino."},{"libro":"Proverbios","cap":"16","vers":"3","texto":"Encomienda a Jehová tus obras, y tus pensamientos serán afirmados.","explica":"Encomendar es poner algo en manos de otro para que lo cuide. Si ponemos nuestros planes y trabajos en manos de Dios, Él los afirma, es decir, les da estabilidad y los lleva por buen camino."},{"libro":"Salmos","cap":"37","vers":"5","texto":"Encomienda a Jehová tu camino, y confía en él; y él hará.","explica":"Este versículo tiene tres partes: entregar a Dios nuestro camino, confiar en Él y dejar que Él actúe. Nosotros hacemos lo que nos toca, y lo demás lo hace Dios."},{"libro":"Romanos","cap":"12","vers":"12","texto":"Gozosos en la esperanza; sufridos en la tribulación; constantes en la oración.","explica":"Tres consejos para la vida diaria: alegrarse por la esperanza que tenemos en Dios, tener paciencia cuando vienen los problemas y no dejar nunca de orar."},{"libro":"Salmos","cap":"73","vers":"26","texto":"Mi carne y mi corazón desfallecen; mas la roca de mi corazón y mi porción es Dios para siempre.","explica":"Con los años el cuerpo se cansa y a veces el corazón se desanima. El salmista lo reconoce, pero dice que Dios es su roca y su herencia para siempre. Aunque nosotros nos debilitemos, Dios no."},{"libro":"Isaías","cap":"46","vers":"4","texto":"Y hasta la vejez yo mismo, y hasta las canas os soportaré yo; yo hice, yo llevaré, yo soportaré y guardaré.","explica":"Este versículo es especial para los abuelos. Dios promete cuidarnos hasta la vejez y hasta las canas. Él nos hizo, nos ha llevado toda la vida y nos seguirá llevando en sus brazos."},{"libro":"1 Corintios","cap":"13","vers":"4","texto":"El amor es sufrido, es benigno; el amor no tiene envidia, el amor no es jactancioso, no se envanece.","explica":"Pablo describe el verdadero amor. Es sufrido, o sea paciente; es benigno, o sea amable; no tiene envidia ni presume. Es un buen espejo para ver cómo estamos amando a los demás."},{"libro":"1 Corintios","cap":"13","vers":"7","texto":"Todo lo sufre, todo lo cree, todo lo espera, todo lo soporta.","explica":"El amor verdadero no se rinde fácil. Aguanta, cree lo mejor del otro, espera con esperanza y soporta las dificultades. Así es como Dios nos ama, y así nos enseña a amar a nuestra familia."},{"libro":"1 Corintios","cap":"13","vers":"13","texto":"Y ahora permanecen la fe, la esperanza y el amor, estos tres; pero el mayor de ellos es el amor.","explica":"De todo lo que podemos tener, tres cosas duran para siempre: la fe, la esperanza y el amor. Y de las tres, la más grande es el amor, porque Dios mismo es amor."},{"libro":"Salmos","cap":"90","vers":"12","texto":"Enséñanos de tal modo a contar nuestros días, que traigamos al corazón sabiduría.","explica":"Moisés pide a Dios que nos enseñe a valorar cada día, porque la vida pasa rápido. Quien cuenta sus días con sabiduría los aprovecha bien: para amar, perdonar y estar cerca de Dios."},{"libro":"Hebreos","cap":"11","vers":"1","texto":"Es, pues, la fe la certeza de lo que se espera, la convicción de lo que no se ve.","explica":"La fe es estar seguros de lo que esperamos aunque todavía no lo veamos. Es como la semilla que sembramos sabiendo que algún día va a dar fruto. Creer en Dios es confiar en sus promesas."},{"libro":"Salmos","cap":"51","vers":"10","texto":"Crea en mí, oh Dios, un corazón limpio, y renueva un espíritu recto dentro de mí.","explica":"David escribió esto después de cometer un pecado grave. Le pidió a Dios un corazón limpio y nuevo. Nos enseña que siempre podemos volver a Dios, y Él nos limpia y nos renueva."},{"libro":"Miqueas","cap":"6","vers":"8","texto":"Oh hombre, él te ha declarado lo que es bueno, y qué pide Jehová de ti: solamente hacer justicia, y amar misericordia, y humillarte ante tu Dios.","explica":"Dios no pide cosas complicadas. Pide tres cosas sencillas: ser justos con los demás, amar la misericordia, que es tratar a otros con compasión, y caminar con humildad junto a Él."},{"libro":"Mateo","cap":"5","vers":"9","texto":"Bienaventurados los pacificadores, porque ellos serán llamados hijos de Dios.","explica":"Los pacificadores son los que buscan la paz: los que unen a la familia, calman los pleitos y perdonan. Jesús dice que ellos se parecen tanto a Dios que serán llamados sus hijos."},{"libro":"Mateo","cap":"5","vers":"8","texto":"Bienaventurados los de limpio corazón, porque ellos verán a Dios.","explica":"Tener un corazón limpio es tener intenciones buenas y sinceras, sin maldad escondida. Jesús promete que esas personas verán a Dios, es decir, lo conocerán de cerca."},{"libro":"Mateo","cap":"5","vers":"4","texto":"Bienaventurados los que lloran, porque ellos recibirán consolación.","explica":"Parece raro que llorar traiga bendición. Pero Jesús promete que los que lloran recibirán consuelo. Dios no ignora nuestras lágrimas: Él mismo nos consuela."},{"libro":"Salmos","cap":"30","vers":"5","texto":"Porque un momento será su ira, pero su favor dura toda la vida. Por la noche durará el lloro, y a la mañana vendrá la alegría.","explica":"Las noches de tristeza no duran para siempre. El salmista nos recuerda que después del llanto viene la mañana con alegría. Si hoy hay tristeza, Dios traerá un nuevo amanecer."},{"libro":"Juan","cap":"16","vers":"33","texto":"Estas cosas os he hablado para que en mí tengáis paz. En el mundo tendréis aflicción; pero confiad, yo he vencido al mundo.","explica":"Jesús fue sincero: en este mundo vamos a tener problemas. Pero nos da ánimo, porque Él ya venció al mundo. Con Él podemos tener paz aun en medio de las dificultades."},{"libro":"Salmos","cap":"40","vers":"1","texto":"Pacientemente esperé a Jehová, y se inclinó a mí, y oyó mi clamor.","explica":"David esperó con paciencia, y Dios se inclinó para escucharlo, como un padre que se agacha para oír a su hijo pequeño. Dios no siempre responde enseguida, pero siempre escucha."},{"libro":"Romanos","cap":"10","vers":"13","texto":"Porque todo aquel que invocare el nombre del Señor, será salvo.","explica":"Esta promesa es para todos, sin excepción. Cualquier persona que llame a Dios con fe será salva. No importa la edad, el pasado ni los errores: la puerta de Dios está abierta."},{"libro":"Salmos","cap":"5","vers":"3","texto":"Oh Jehová, de mañana oirás mi voz; de mañana me presentaré delante de ti, y esperaré.","explica":"David empezaba el día hablando con Dios. Por la mañana le contaba sus cosas y luego esperaba su respuesta con confianza. Es una linda costumbre empezar cada mañana orando, como ahora."},{"libro":"Santiago","cap":"1","vers":"5","texto":"Y si alguno de vosotros tiene falta de sabiduría, pídala a Dios, el cual da a todos abundantemente y sin reproche, y le será dada.","explica":"Cuando no sabemos qué hacer, podemos pedirle sabiduría a Dios. Él la da con generosidad y sin regañarnos por preguntar. Solo hay que pedir con fe."},{"libro":"Salmos","cap":"19","vers":"14","texto":"Sean gratos los dichos de mi boca y la meditación de mi corazón delante de ti, oh Jehová, roca mía, y redentor mío.","explica":"Esta es una oración para pedir que nuestras palabras y pensamientos le agraden a Dios. Es buena para empezar el día: que lo que digamos y pensemos hoy sea bueno ante sus ojos."},{"libro":"Efesios","cap":"3","vers":"20","texto":"Y a Aquel que es poderoso para hacer todas las cosas mucho más abundantemente de lo que pedimos o entendemos, según el poder que actúa en nosotros.","explica":"Dios puede hacer mucho más de lo que le pedimos y aún más de lo que imaginamos. Nuestras oraciones se quedan cortas al lado de lo que Él puede hacer. Por eso podemos pedirle con confianza."},{"libro":"Salmos","cap":"86","vers":"5","texto":"Porque tú, Señor, eres bueno y perdonador, y grande en misericordia para con todos los que te invocan.","explica":"David describe a Dios como bueno, como alguien que perdona y que tiene mucha misericordia. Todo el que lo llama encuentra un Dios dispuesto a perdonar y a ayudar."},{"libro":"Nahúm","cap":"1","vers":"7","texto":"Jehová es bueno, fortaleza en el día de la angustia; y conoce a los que en él confían.","explica":"En el día de la angustia, Dios es una fortaleza, es decir, un lugar seguro. Y además conoce a cada uno de los que confían en Él. No somos uno más entre la multitud: Dios te conoce por tu nombre."},{"libro":"Mateo","cap":"7","vers":"7","texto":"Pedid, y se os dará; buscad, y hallaréis; llamad, y se os abrirá.","explica":"Jesús nos invita a orar con insistencia: pedir, buscar y tocar la puerta. Dios es como un padre que escucha a sus hijos. Quien busca a Dios de verdad, lo encuentra."},{"libro":"Salmos","cap":"136","vers":"1","texto":"Alabad a Jehová, porque él es bueno, porque para siempre es su misericordia.","explica":"Este salmo repite en cada verso: \"para siempre es su misericordia\". El pueblo lo cantaba para recordar que el amor de Dios no tiene fin. Hoy es un buen día para darle gracias por eso."},{"libro":"Juan","cap":"13","vers":"34","texto":"Un mandamiento nuevo os doy: Que os améis unos a otros; como yo os he amado, que también os améis unos a otros.","explica":"Jesús nos dio un mandamiento nuevo: amarnos como Él nos amó, con paciencia, perdón y entrega. El amor en la familia y entre hermanos es la marca de que seguimos a Jesús."},{"libro":"Salmos","cap":"94","vers":"19","texto":"En la multitud de mis pensamientos dentro de mí, tus consolaciones alegraban mi alma.","explica":"Cuando la cabeza se llena de pensamientos y preocupaciones, el salmista encontraba consuelo en Dios. Las palabras de Dios calmaban su alma y le devolvían la alegría."},{"libro":"Colosenses","cap":"3","vers":"23","texto":"Y todo lo que hagáis, hacedlo de corazón, como para el Señor y no para los hombres.","explica":"Todo lo que hacemos, hasta lo más sencillo como cocinar, limpiar o cuidar a alguien, podemos hacerlo de corazón y para Dios. Así cada tarea pequeña se vuelve una forma de amarlo."},{"libro":"Salmos","cap":"61","vers":"2","texto":"Desde el cabo de la tierra clamaré a ti, cuando mi corazón desmayare. Llévame a la roca que es más alta que yo.","explica":"David clamaba a Dios desde lejos, con el corazón cansado. Le pide que lo lleve a una roca más alta que él, es decir, a un lugar seguro que él solo no puede alcanzar. Dios es esa roca."},{"libro":"Isaías","cap":"12","vers":"2","texto":"He aquí Dios es salvación mía; me aseguraré y no temeré; porque mi fortaleza y mi canción es JAH Jehová, quien ha sido salvación para mí.","explica":"El profeta dice que Dios es su salvación, y por eso confía y no tiene miedo. Dios no solo es su fuerza sino también su canción: el motivo de su alegría."},{"libro":"Proverbios","cap":"17","vers":"22","texto":"El corazón alegre constituye buen remedio; mas el espíritu triste seca los huesos.","explica":"La Biblia ya sabía que la alegría es buena medicina. Un corazón alegre ayuda al cuerpo y al alma, mientras que la tristeza constante nos desgasta. Hoy busca un motivo para sonreír."},{"libro":"Salmos","cap":"143","vers":"8","texto":"Hazme oír por la mañana tu misericordia, porque en ti he confiado; hazme saber el camino por donde ande, porque a ti he elevado mi alma.","explica":"Esta es una oración perfecta para las mañanas. David pide escuchar el amor de Dios al empezar el día y que Dios le muestre por dónde caminar. Hoy puedes hacer la misma oración."},{"libro":"Mateo","cap":"19","vers":"26","texto":"Y mirándolos Jesús, les dijo: Para los hombres esto es imposible; mas para Dios todo es posible.","explica":"Los discípulos se preguntaban quién podía salvarse, y Jesús les dijo que para las personas es imposible, pero para Dios no hay imposibles. Lo que a nosotros nos parece sin salida, Dios lo puede resolver."},{"libro":"Salmos","cap":"147","vers":"3","texto":"Él sana a los quebrantados de corazón, y venda sus heridas.","explica":"Dios es como un médico del alma. Sana a los que tienen el corazón roto y venda sus heridas con cuidado. No hay dolor que Dios no pueda consolar."},{"libro":"Efesios","cap":"4","vers":"32","texto":"Antes sed benignos unos con otros, misericordiosos, perdonándoos unos a otros, como Dios también os perdonó a vosotros en Cristo.","explica":"Pablo nos pide ser amables y compasivos, y perdonarnos unos a otros. La razón es poderosa: Dios ya nos perdonó a nosotros en Cristo. Quien ha sido perdonado aprende a perdonar."},{"libro":"Salmos","cap":"18","vers":"2","texto":"Jehová, roca mía y castillo mío, y mi libertador; Dios mío, fortaleza mía, en él confiaré; mi escudo, y la fuerza de mi salvación, mi alto refugio.","explica":"David usa muchas imágenes para describir a Dios: roca, castillo, libertador, escudo, refugio. Todas dicen lo mismo: con Dios estamos seguros. Es un versículo para recordar en los días difíciles."},{"libro":"Isaías","cap":"30","vers":"15","texto":"Porque así dijo Jehová el Señor, el Santo de Israel: En descanso y en reposo seréis salvos; en quietud y en confianza será vuestra fortaleza.","explica":"Dios le dijo a su pueblo que su fuerza no estaba en correr de un lado a otro, sino en descansar y confiar en Él. A veces la mejor fuerza es quedarse tranquila y dejar que Dios actúe."},{"libro":"1 Juan","cap":"4","vers":"8","texto":"El que no ama, no ha conocido a Dios; porque Dios es amor.","explica":"Juan resume quién es Dios en una frase: Dios es amor. Por eso, quien conoce a Dios aprende a amar. El amor que damos a otros muestra que conocemos a Dios."},{"libro":"Salmos","cap":"46","vers":"10","texto":"Estad quietos, y conoced que yo soy Dios; seré exaltado entre las naciones; enaltecido seré en la tierra.","explica":"Estad quietos quiere decir: dejen de preocuparse y de pelear, y reconozcan que Dios está en control. Es una invitación a parar un momento, respirar y recordar que Él es Dios."},{"libro":"2 Corintios","cap":"5","vers":"17","texto":"De modo que si alguno está en Cristo, nueva criatura es; las cosas viejas pasaron; he aquí todas son hechas nuevas.","explica":"Cuando alguien está con Cristo, empieza una vida nueva. Lo viejo, los errores y las culpas del pasado, quedan atrás. Con Dios siempre se puede empezar de nuevo."},{"libro":"Salmos","cap":"121","vers":"7-8","texto":"Jehová te guardará de todo mal; él guardará tu alma. Jehová guardará tu salida y tu entrada desde ahora y para siempre.","explica":"Este salmo era para los viajeros. Dios promete cuidarnos de todo mal, al salir y al entrar de casa, hoy y siempre. Es una bendición para todos los días."},{"libro":"Apocalipsis","cap":"21","vers":"4","texto":"Enjugará Dios toda lágrima de los ojos de ellos; y ya no habrá muerte, ni habrá más llanto, ni clamor, ni dolor; porque las primeras cosas pasaron.","explica":"Aquí se describe el cielo que Dios prepara. Allí Dios mismo secará nuestras lágrimas y ya no habrá muerte, dolor ni tristeza. Es la esperanza más grande que tenemos."},{"libro":"Juan","cap":"6","vers":"35","texto":"Jesús les dijo: Yo soy el pan de vida; el que a mí viene, nunca tendrá hambre; y el que en mí cree, no tendrá sed jamás.","explica":"Así como el pan alimenta el cuerpo, Jesús alimenta el alma. Él dice que quien viene a Él no tendrá hambre ni sed por dentro. Solo Jesús llena el vacío del corazón."},{"libro":"Salmos","cap":"63","vers":"1","texto":"Dios, Dios mío eres tú; de madrugada te buscaré; mi alma tiene sed de ti.","explica":"David busca a Dios desde temprano, de madrugada, como quien tiene mucha sed busca agua. Así de fuerte puede ser nuestro deseo de estar cerca de Dios."},{"libro":"Isaías","cap":"9","vers":"6","texto":"Porque un niño nos es nacido, hijo nos es dado, y el principado sobre su hombro; y se llamará su nombre Admirable, Consejero, Dios Fuerte, Padre Eterno, Príncipe de Paz.","explica":"Isaías anunció el nacimiento de Jesús muchos años antes. Le da nombres hermosos: Consejero que guía, Dios fuerte que protege, Padre eterno que cuida y Príncipe de paz."},{"libro":"Proverbios","cap":"31","vers":"30","texto":"Engañosa es la gracia, y vana la hermosura; la mujer que teme a Jehová, ésa será alabada.","explica":"La belleza física pasa con los años, pero la mujer que ama y respeta a Dios es admirada siempre. Lo que de verdad vale es un corazón que confía en Dios."},{"libro":"Salmos","cap":"92","vers":"1-2","texto":"Bueno es alabarte, oh Jehová, y cantar salmos a tu nombre, oh Altísimo; anunciar por la mañana tu misericordia, y tu fidelidad cada noche.","explica":"Este salmo nos invita a hablar del amor de Dios en la mañana y de su fidelidad en la noche. Empezar y terminar el día dando gracias es una costumbre que llena el corazón de paz."},{"libro":"Filipenses","cap":"1","vers":"6","texto":"Estando persuadido de esto, que el que comenzó en vosotros la buena obra, la perfeccionará hasta el día de Jesucristo.","explica":"Lo que Dios empezó en tu vida, lo va a terminar. Él no deja las cosas a medias. Aunque a veces sintamos que avanzamos poco, Dios sigue trabajando en nosotros."},{"libro":"Salmos","cap":"36","vers":"5","texto":"Jehová, hasta los cielos llega tu misericordia, y tu fidelidad alcanza hasta las nubes.","explica":"David dice que el amor de Dios es tan grande que llega hasta el cielo, y que su fidelidad alcanza las nubes. Es una forma de decir que no se puede medir."},{"libro":"Mateo","cap":"11","vers":"29-30","texto":"Llevad mi yugo sobre vosotros, y aprended de mí, que soy manso y humilde de corazón; y hallaréis descanso para vuestras almas; porque mi yugo es fácil, y ligera mi carga.","explica":"El yugo era la madera que unía a dos bueyes para trabajar juntos. Jesús nos invita a caminar junto a Él, y dice que su carga es liviana porque Él lleva la parte pesada. Con Él hay descanso."},{"libro":"Salmos","cap":"9","vers":"1","texto":"Te alabaré, oh Jehová, con todo mi corazón; contaré todas tus maravillas.","explica":"David decide alabar a Dios con todo el corazón y contar todas las cosas buenas que Él ha hecho. Hoy podemos hacer lo mismo: recordar y contar lo que Dios ha hecho en nuestra vida."},{"libro":"Romanos","cap":"5","vers":"8","texto":"Mas Dios muestra su amor para con nosotros, en que siendo aún pecadores, Cristo murió por nosotros.","explica":"Dios no esperó a que fuéramos buenos para amarnos. Cristo murió por nosotros cuando todavía éramos pecadores. Esa es la prueba más grande de su amor."},{"libro":"Salmos","cap":"42","vers":"11","texto":"¿Por qué te abates, oh alma mía, y por qué te turbas dentro de mí? Espera en Dios; porque aún he de alabarle, salvación mía y Dios mío.","explica":"El salmista estaba triste y le habla a su propia alma: ¿por qué estás tan abatida? Espera en Dios. Es un buen ejemplo de cómo animarnos a nosotros mismos con la fe."},{"libro":"Isaías","cap":"40","vers":"8","texto":"Sécase la hierba, marchítase la flor; mas la palabra del Dios nuestro permanece para siempre.","explica":"Las flores y la hierba se secan, todo en este mundo pasa. Pero la Palabra de Dios no cambia ni se acaba. Sus promesas siguen firmes para siempre."},{"libro":"Juan","cap":"14","vers":"1-2","texto":"No se turbe vuestro corazón; creéis en Dios, creed también en mí. En la casa de mi Padre muchas moradas hay; si así no fuera, yo os lo hubiera dicho; voy, pues, a preparar lugar para vosotros.","explica":"Jesús dijo esto antes de irse para consolar a sus amigos. Les prometió que en la casa de su Padre hay lugar para todos, y que Él mismo lo está preparando. El cielo es nuestro hogar."},{"libro":"Salmos","cap":"145","vers":"8","texto":"Clemente y misericordioso es Jehová, lento para la ira, y grande en misericordia.","explica":"Este versículo describe el carácter de Dios: es compasivo, tiene paciencia y su amor es enorme. Dios no se enoja fácil; prefiere perdonar."},{"libro":"Hebreos","cap":"4","vers":"16","texto":"Acerquémonos, pues, confiadamente al trono de la gracia, para alcanzar misericordia y hallar gracia para el oportuno socorro.","explica":"Podemos acercarnos a Dios con confianza, no con miedo. Allí encontramos misericordia y ayuda justo cuando la necesitamos. Dios siempre tiene la puerta abierta."},{"libro":"Salmos","cap":"116","vers":"1-2","texto":"Amo a Jehová, pues ha oído mi voz y mis súplicas; porque ha inclinado a mí su oído; por tanto, le invocaré en todos mis días.","explica":"El salmista ama a Dios porque Dios lo escuchó. Y como Dios se inclinó para oírle, decide hablar con Él todos los días de su vida. Dios sí escucha nuestras oraciones."},{"libro":"Proverbios","cap":"22","vers":"6","texto":"Instruye al niño en su camino, y aun cuando fuere viejo no se apartará de él.","explica":"Lo que se enseña a los niños desde pequeños los acompaña toda la vida. Este versículo es para padres y abuelos: la fe y los valores que sembramos en los nietos dan fruto."},{"libro":"Salmos","cap":"127","vers":"1","texto":"Si Jehová no edificare la casa, en vano trabajan los que la edifican.","explica":"Una casa, una familia o un trabajo sin Dios no tienen buena base. Este salmo nos recuerda poner a Dios en el centro de nuestro hogar, porque Él es quien lo hace firme."},{"libro":"Juan","cap":"1","vers":"5","texto":"La luz en las tinieblas resplandece, y las tinieblas no prevalecieron contra ella.","explica":"La luz de Jesús brilla en medio de la oscuridad, y la oscuridad no ha podido apagarla. Por más tristes que estén las cosas, la luz de Dios siempre es más fuerte."},{"libro":"Salmos","cap":"31","vers":"24","texto":"Esforzaos todos vosotros los que esperáis en Jehová, y tome aliento vuestro corazón.","explica":"Este es un llamado a tener ánimo. A los que esperan en Dios, el salmista les dice: sean fuertes y tengan valor en el corazón. Esperar en Dios nunca es en vano."},{"libro":"1 Corintios","cap":"16","vers":"14","texto":"Todas vuestras cosas sean hechas con amor.","explica":"Un consejo corto y completo: que todo lo que hagamos, lo hagamos con amor. En casa, con la familia, con los vecinos. El amor da sentido a todo lo demás."},{"libro":"Salmos","cap":"57","vers":"10","texto":"Porque grande es hasta los cielos tu misericordia, y hasta las nubes tu verdad.","explica":"David se maravilla de lo grande que es el amor y la verdad de Dios, tan altos como el cielo y las nubes. Por eso le alaba entre todos los pueblos."},{"libro":"Gálatas","cap":"5","vers":"22-23","texto":"Mas el fruto del Espíritu es amor, gozo, paz, paciencia, benignidad, bondad, fe, mansedumbre, templanza; contra tales cosas no hay ley.","explica":"Cuando el Espíritu Santo vive en nosotros, produce buenos frutos, como un árbol sano: amor, alegría, paz, paciencia, amabilidad, bondad, fe, humildad y control de uno mismo."},{"libro":"Salmos","cap":"103","vers":"13","texto":"Como el padre se compadece de los hijos, se compadece Jehová de los que le temen.","explica":"Dios nos trata como un buen padre trata a sus hijos: con ternura y compasión. Entiende nuestras debilidades y nos cuida con cariño."},{"libro":"Isaías","cap":"41","vers":"13","texto":"Porque yo Jehová soy tu Dios, quien te sostiene de tu mano derecha, y te dice: No temas, yo te ayudo.","explica":"Dios se describe como alguien que nos toma de la mano derecha y nos dice: no temas, yo te ayudo. Es como un padre que lleva a su hijo de la mano para cruzar la calle."},{"libro":"Mateo","cap":"5","vers":"16","texto":"Así alumbre vuestra luz delante de los hombres, para que vean vuestras buenas obras, y glorifiquen a vuestro Padre que está en los cielos.","explica":"Nuestras buenas obras son como una luz que otros ven. Pero el propósito no es que nos aplaudan a nosotros, sino que la gente vea el amor de Dios y le dé gloria a Él."},{"libro":"Salmos","cap":"138","vers":"8","texto":"Jehová cumplirá su propósito en mí; tu misericordia, oh Jehová, es para siempre.","explica":"David estaba seguro de que Dios iba a cumplir sus planes en su vida. Su amor es para siempre, y Él no abandona lo que empezó con sus manos."},{"libro":"2 Tesalonicenses","cap":"3","vers":"16","texto":"Y el mismo Señor de paz os dé siempre paz en toda manera. El Señor sea con todos vosotros.","explica":"Pablo bendice a los creyentes pidiendo que el Señor, que es la fuente de la paz, les dé paz siempre y en toda situación. Hoy esa bendición es para ti."},{"libro":"Salmos","cap":"71","vers":"5","texto":"Porque tú, oh Señor Jehová, eres mi esperanza, seguridad mía desde mi juventud.","explica":"El salmista dice que Dios ha sido su esperanza y su seguridad desde que era joven. Mirar atrás y ver cómo Dios nos ha cuidado toda la vida nos da confianza para el futuro."},{"libro":"Salmos","cap":"71","vers":"18","texto":"Aun en la vejez y las canas, oh Dios, no me desampares, hasta que anuncie tu poder a la posteridad.","explica":"Esta es la oración de una persona mayor. Le pide a Dios que no la deje en la vejez, para poder contar a sus hijos y nietos todo lo que Dios ha hecho. Tus historias de fe son un tesoro para tu familia."},{"libro":"Juan","cap":"3","vers":"17","texto":"Porque no envió Dios a su Hijo al mundo para condenar al mundo, sino para que el mundo sea salvo por él.","explica":"Jesús no vino a condenar ni a castigar, sino a salvar. Dios no está buscando culpables: está buscando rescatarnos por amor."},{"libro":"Salmos","cap":"25","vers":"4-5","texto":"Muéstrame, oh Jehová, tus caminos; enséñame tus sendas. Encamíname en tu verdad, y enséñame, porque tú eres el Dios de mi salvación; en ti he esperado todo el día.","explica":"David pide a Dios que le enseñe sus caminos y lo guíe en la verdad. Es una oración humilde: reconocer que necesitamos que Dios nos enseñe cada día."},{"libro":"Proverbios","cap":"15","vers":"1","texto":"La blanda respuesta quita la ira; mas la palabra áspera hace subir el furor.","explica":"Responder con suavidad calma los enojos, mientras que las palabras duras los empeoran. Un consejo sabio para la familia: hablar con dulzura evita muchos pleitos."},{"libro":"Salmos","cap":"113","vers":"3","texto":"Desde el nacimiento del sol hasta donde se pone, sea alabado el nombre de Jehová.","explica":"Desde que sale el sol hasta que se pone, todo el día, el nombre de Dios merece ser alabado. Podemos alabarlo en la mañana, en la tarde y en la noche."},{"libro":"1 Pedro","cap":"2","vers":"9","texto":"Mas vosotros sois linaje escogido, real sacerdocio, nación santa, pueblo adquirido por Dios, para que anunciéis las virtudes de aquel que os llamó de las tinieblas a su luz admirable.","explica":"Pedro les recuerda a los creyentes quiénes son: escogidos por Dios, su pueblo especial. Dios nos sacó de la oscuridad a su luz para que contemos lo bueno que es Él."},{"libro":"Salmos","cap":"84","vers":"11","texto":"Porque sol y escudo es Jehová Dios; gracia y gloria dará Jehová. No quitará el bien a los que andan en integridad.","explica":"Dios es como el sol que da luz y calor, y como un escudo que protege. A los que caminan con Él, no les negará ningún bien."},{"libro":"Romanos","cap":"8","vers":"31","texto":"¿Qué, pues, diremos a esto? Si Dios es por nosotros, ¿quién contra nosotros?","explica":"Pablo hace una pregunta que da mucho ánimo: si Dios está de nuestro lado, ¿quién puede contra nosotros? Con Dios a favor, no hay que tenerle miedo a nada."},{"libro":"Salmos","cap":"56","vers":"3","texto":"En el día que temo, yo en ti confío.","explica":"Este es uno de los versículos más cortos y sencillos para memorizar. David reconoce que a veces siente miedo, pero dice: cuando tengo miedo, confío en ti."},{"libro":"Isaías","cap":"58","vers":"11","texto":"Jehová te pastoreará siempre, y en las sequías saciará tu alma, y dará vigor a tus huesos; y serás como huerto de riego, y como manantial de aguas, cuyas aguas nunca faltan.","explica":"Dios promete guiarnos siempre y saciarnos aun en tiempos secos. Seremos como un jardín bien regado y como un manantial que nunca se seca. Así es una vida cuidada por Dios."},{"libro":"Mateo","cap":"18","vers":"20","texto":"Porque donde están dos o tres congregados en mi nombre, allí estoy yo en medio de ellos.","explica":"Jesús promete estar presente cuando nos reunimos en su nombre, aunque seamos solo dos o tres. Cuando la familia ora junta, Jesús está ahí con ellos."},{"libro":"Salmos","cap":"150","vers":"6","texto":"Todo lo que respira alabe a JAH. Aleluya.","explica":"Este es el último versículo del libro de los Salmos. Invita a todo lo que respira a alabar a Dios. Mientras tengamos aliento, tenemos un motivo para alabarle."},{"libro":"Colosenses","cap":"3","vers":"15","texto":"Y la paz de Dios gobierne en vuestros corazones, a la que asimismo fuisteis llamados en un solo cuerpo; y sed agradecidos.","explica":"Pablo pide que la paz de Cristo sea la que mande en nuestro corazón, como un árbitro que decide. Y añade algo sencillo: sean agradecidos."},{"libro":"Salmos","cap":"33","vers":"20-21","texto":"Nuestra alma espera a Jehová; nuestra ayuda y nuestro escudo es él. Por tanto, en él se alegrará nuestro corazón, porque en su santo nombre hemos confiado.","explica":"El pueblo de Dios espera en Él porque es su ayuda y su escudo. Y esa confianza produce alegría en el corazón. Confiar en Dios trae gozo."},{"libro":"Eclesiastés","cap":"3","vers":"1","texto":"Todo tiene su tiempo, y todo lo que se quiere debajo del cielo tiene su hora.","explica":"Todo en la vida tiene su momento: tiempo de reír y de llorar, de sembrar y de cosechar. Dios conoce cada etapa de nuestra vida y está en todas ellas."},{"libro":"Salmos","cap":"68","vers":"19","texto":"Bendito el Señor; cada día nos colma de beneficios el Dios de nuestra salvación.","explica":"Cada día Dios nos llena de beneficios, aunque a veces no los notemos: el aire, la comida, la familia, un día más de vida. Por eso merece ser bendecido."},{"libro":"Juan","cap":"15","vers":"13","texto":"Nadie tiene mayor amor que este, que uno ponga su vida por sus amigos.","explica":"Jesús dice que el amor más grande es dar la vida por los amigos. Eso es justamente lo que Él hizo por nosotros. Nos llama amigos y nos amó hasta el final."},{"libro":"Salmos","cap":"107","vers":"1","texto":"Alabad a Jehová, porque él es bueno; porque para siempre es su misericordia.","explica":"Este salmo empieza con una invitación a dar gracias a Dios por dos razones: porque es bueno y porque su amor dura para siempre."},{"libro":"Hebreos","cap":"12","vers":"1-2","texto":"Corramos con paciencia la carrera que tenemos por delante, puestos los ojos en Jesús, el autor y consumador de la fe.","explica":"La vida de fe es como una carrera larga. Para no cansarnos, hay que tener los ojos puestos en Jesús, que es quien empezó nuestra fe y la lleva hasta el final."},{"libro":"Salmos","cap":"3","vers":"3","texto":"Mas tú, Jehová, eres escudo alrededor de mí; mi gloria, y el que levanta mi cabeza.","explica":"David escribió esto cuando huía de su propio hijo. Aun así, dice que Dios es su escudo y el que le levanta la cabeza. Cuando estamos tristes o avergonzados, Dios nos levanta."},{"libro":"Juan","cap":"4","vers":"14","texto":"Mas el que bebiere del agua que yo le daré, no tendrá sed jamás; sino que el agua que yo le daré será en él una fuente de agua que salte para vida eterna.","explica":"Jesús le dijo esto a una mujer junto a un pozo. El agua del pozo quita la sed un rato, pero lo que Jesús da llena el alma para siempre, como un manantial que no se seca."},{"libro":"Salmos","cap":"23","vers":"6","texto":"Ciertamente el bien y la misericordia me seguirán todos los días de mi vida, y en la casa de Jehová moraré por largos días.","explica":"El salmo 23 termina con esta promesa: el bien y la misericordia de Dios nos van a seguir todos los días de nuestra vida, y al final viviremos en la casa de Dios para siempre."},{"libro":"Éxodo","cap":"14","vers":"14","texto":"Jehová peleará por vosotros, y vosotros estaréis tranquilos.","explica":"Moisés le dijo esto al pueblo cuando estaba atrapado entre el mar y el ejército enemigo. Dios peleó por ellos y abrió el mar. Hay batallas que Dios pelea por nosotros mientras descansamos en Él."},{"libro":"Salmos","cap":"29","vers":"11","texto":"Jehová dará poder a su pueblo; Jehová bendecirá a su pueblo con paz.","explica":"Dios da fuerza a su pueblo y lo bendice con paz. Son dos regalos que necesitamos cada día: fuerza para seguir y paz en el corazón."},{"libro":"Romanos","cap":"12","vers":"10","texto":"Amaos los unos a los otros con amor fraternal; en cuanto a honra, prefiriéndoos los unos a los otros.","explica":"Pablo nos pide amarnos como hermanos y tratar a los demás con respeto, pensando primero en ellos. Así se vive el amor en la familia y en la iglesia."},{"libro":"Salmos","cap":"119","vers":"114","texto":"Mi escondedero y mi escudo eres tú; en tu palabra he esperado.","explica":"Un escondedero es un lugar secreto y seguro. El salmista dice que Dios es su refugio y su escudo, y que pone su esperanza en lo que Dios ha prometido."},{"libro":"Isaías","cap":"55","vers":"8-9","texto":"Porque mis pensamientos no son vuestros pensamientos, ni vuestros caminos mis caminos, dijo Jehová. Como son más altos los cielos que la tierra, así son mis caminos más altos que vuestros caminos.","explica":"Dios piensa de manera distinta a nosotros, mucho más alta. Por eso a veces no entendemos lo que pasa. Pero podemos confiar en que sus caminos son mejores que los nuestros."},{"libro":"Mateo","cap":"6","vers":"26","texto":"Mirad las aves del cielo, que no siembran, ni siegan, ni recogen en graneros; y vuestro Padre celestial las alimenta. ¿No valéis vosotros mucho más que ellas?","explica":"Jesús nos invita a mirar los pajaritos: no guardan comida, y Dios los alimenta cada día. Si Dios cuida así de los pájaros, ¡cuánto más te cuidará a ti!"},{"libro":"Salmos","cap":"48","vers":"14","texto":"Porque este Dios es Dios nuestro eternamente y para siempre; él nos guiará aun más allá de la muerte.","explica":"El salmista celebra que Dios es nuestro Dios para siempre, y que nos guiará toda la vida y aun más allá de la muerte. Nunca dejamos de estar en sus manos."},{"libro":"1 Juan","cap":"1","vers":"9","texto":"Si confesamos nuestros pecados, él es fiel y justo para perdonar nuestros pecados, y limpiarnos de toda maldad.","explica":"Cuando le contamos a Dios nuestras faltas con sinceridad, Él nos perdona y nos limpia por completo. No hay pecado tan grande que Dios no pueda perdonar."},{"libro":"Salmos","cap":"65","vers":"11","texto":"Tú coronas el año con tus bienes, y tus nubes destilan grosura.","explica":"Este salmo es una canción de agradecimiento por la cosecha. Dios corona el año con sus bendiciones, como quien pone una corona. Cada año vivido está lleno de sus regalos."},{"libro":"Juan","cap":"10","vers":"10","texto":"El ladrón no viene sino para hurtar y matar y destruir; yo he venido para que tengan vida, y para que la tengan en abundancia.","explica":"Jesús contrasta al ladrón, que viene a robar y destruir, con Él mismo, que vino a darnos vida, y vida en abundancia. Con Jesús la vida es plena, aun en las cosas sencillas."},{"libro":"Salmos","cap":"125","vers":"2","texto":"Como Jerusalén tiene montes alrededor de ella, así Jehová está alrededor de su pueblo desde ahora y para siempre.","explica":"Jerusalén está rodeada de montañas que la protegen. Así rodea Dios a su pueblo. Estamos rodeados por su cuidado por todos lados, hoy y siempre."},{"libro":"Proverbios","cap":"4","vers":"23","texto":"Sobre toda cosa guardada, guarda tu corazón; porque de él mana la vida.","explica":"El corazón es como una fuente: lo que hay dentro sale en nuestras palabras y acciones. Por eso hay que cuidarlo, llenarlo de cosas buenas y de la Palabra de Dios."},{"libro":"Salmos","cap":"40","vers":"3","texto":"Puso luego en mi boca cántico nuevo, alabanza a nuestro Dios. Verán esto muchos, y temerán, y confiarán en Jehová.","explica":"Dios le dio a David un canto nuevo después de sacarlo de un momento difícil. Cuando otros ven lo que Dios hace en nuestra vida, también aprenden a confiar en Él."},{"libro":"Lucas","cap":"1","vers":"37","texto":"Porque nada hay imposible para Dios.","explica":"El ángel le dijo esto a María cuando le anunció que sería la madre de Jesús. También le contó que su prima Isabel, ya mayor, iba a tener un hijo. Para Dios no hay nada imposible."},{"libro":"Salmos","cap":"59","vers":"16","texto":"Pero yo cantaré de tu poder, y alabaré de mañana tu misericordia; porque has sido mi amparo y refugio en el día de mi angustia.","explica":"David canta en la mañana por el poder y el amor de Dios, porque Dios fue su refugio en los días de angustia. Las mañanas son un buen momento para agradecer el cuidado de Dios."},{"libro":"Rut","cap":"1","vers":"16","texto":"Porque a dondequiera que tú fueres, iré yo, y dondequiera que vivieres, viviré. Tu pueblo será mi pueblo, y tu Dios mi Dios.","explica":"Rut le dijo esto a su suegra Noemí, que se había quedado viuda. Rut decidió no dejarla sola y seguir a su Dios. Es un ejemplo hermoso de amor y lealtad en la familia."},{"libro":"Salmos","cap":"126","vers":"3","texto":"Grandes cosas ha hecho Jehová con nosotros; estaremos alegres.","explica":"El pueblo recordaba con alegría las grandes cosas que Dios había hecho por ellos. Hoy podemos mirar atrás y decir lo mismo: Dios ha hecho grandes cosas con nosotros."},{"libro":"Filipenses","cap":"4","vers":"19","texto":"Mi Dios, pues, suplirá todo lo que os falta conforme a sus riquezas en gloria en Cristo Jesús.","explica":"Pablo da gracias a unos hermanos que lo ayudaron, y les asegura que Dios suplirá todo lo que les falte. Dios es rico y generoso, y cuida de sus hijos."},{"libro":"Salmos","cap":"34","vers":"4","texto":"Busqué a Jehová, y él me oyó, y me libró de todos mis temores.","explica":"David buscó a Dios cuando tenía miedo, y Dios lo escuchó y lo libró de todos sus temores. Cuando tengas miedo, búscalo; Él responde."},{"libro":"Isaías","cap":"43","vers":"1","texto":"No temas, porque yo te redimí; te puse nombre, mía eres tú.","explica":"Dios dice: te llamé por tu nombre, eres mía. No somos un número para Dios. Nos conoce personalmente y le pertenecemos. Por eso no hay que temer."},{"libro":"Lucas","cap":"6","vers":"31","texto":"Y como queréis que hagan los hombres con vosotros, así también haced vosotros con ellos.","explica":"Esta es la llamada regla de oro: tratar a los demás como queremos que nos traten a nosotros. Es sencilla de entender y transforma la convivencia."},{"libro":"Salmos","cap":"103","vers":"11-12","texto":"Porque como la altura de los cielos sobre la tierra, engrandeció su misericordia sobre los que le temen. Cuanto está lejos el oriente del occidente, hizo alejar de nosotros nuestras rebeliones.","explica":"El amor de Dios es tan grande como la distancia entre el cielo y la tierra. Y cuando nos perdona, aleja nuestros pecados tan lejos como el oriente del occidente: nunca se juntan."},{"libro":"2 Corintios","cap":"4","vers":"16","texto":"Por tanto, no desmayamos; antes aunque este nuestro hombre exterior se va desgastando, el interior no obstante se renueva de día en día.","explica":"Con los años el cuerpo se va desgastando, pero Pablo dice que el interior, el alma, se renueva cada día con Dios. Por fuera envejecemos, por dentro rejuvenecemos."},{"libro":"Salmos","cap":"27","vers":"14","texto":"Aguarda a Jehová; esfuérzate, y aliéntese tu corazón; sí, espera a Jehová.","explica":"Esperar no siempre es fácil. David nos anima a esperar en Dios con valor y con el corazón firme. Lo repite dos veces, porque esperar en Dios vale la pena."},{"libro":"Juan","cap":"20","vers":"29","texto":"Jesús le dijo: Porque me has visto, Tomás, creíste; bienaventurados los que no vieron, y creyeron.","explica":"Tomás no creyó hasta ver a Jesús resucitado. Jesús dijo que son felices los que creen sin haberlo visto. Eso somos nosotros: creemos en Él aunque no lo vemos con los ojos."},{"libro":"Salmos","cap":"85","vers":"10","texto":"La misericordia y la verdad se encontraron; la justicia y la paz se besaron.","explica":"Este versículo es como un abrazo: el amor y la verdad de Dios se encuentran, la justicia y la paz se besan. En Dios todo lo bueno se une."},{"libro":"Proverbios","cap":"10","vers":"22","texto":"La bendición de Jehová es la que enriquece, y no añade tristeza con ella.","explica":"La bendición de Dios es la verdadera riqueza, y no trae tristezas con ella. El dinero a veces trae problemas; la bendición de Dios trae paz."},{"libro":"Salmos","cap":"119","vers":"50","texto":"Ella es mi consuelo en mi aflicción, porque tu dicho me ha vivificado.","explica":"En los momentos de dolor, la Palabra de Dios es un consuelo que da vida. Lo que Dios ha dicho nos levanta cuando estamos decaídos."},{"libro":"Romanos","cap":"8","vers":"18","texto":"Pues tengo por cierto que las aflicciones del tiempo presente no son comparables con la gloria venidera que en nosotros ha de manifestarse.","explica":"Pablo compara los sufrimientos de esta vida con la gloria que nos espera en el cielo. Dice que no hay comparación: lo que viene es mucho más grande que lo que hoy duele."},{"libro":"Salmos","cap":"16","vers":"8","texto":"A Jehová he puesto siempre delante de mí; porque está a mi diestra, no seré conmovido.","explica":"David siempre tenía a Dios presente, como alguien que está a su lado derecho. Por eso no se tambaleaba. Tener a Dios en cuenta en todo nos da firmeza."},{"libro":"Marcos","cap":"9","vers":"23","texto":"Jesús le dijo: Si puedes creer, al que cree todo le es posible.","explica":"Un padre le pidió a Jesús que sanara a su hijo \"si puedes\". Jesús le respondió que todo es posible para el que cree. El padre dijo: \"creo, ayuda mi falta de fe\". Dios ayuda también nuestra fe pequeña."},{"libro":"Salmos","cap":"146","vers":"5","texto":"Bienaventurado aquel cuyo ayudador es el Dios de Jacob, cuya esperanza está en Jehová su Dios.","explica":"El salmista dice que es feliz quien tiene a Dios como su ayudador y pone en Él su esperanza. Las personas a veces fallan, pero Dios nunca."},{"libro":"Mateo","cap":"5","vers":"3","texto":"Bienaventurados los pobres en espíritu, porque de ellos es el reino de los cielos.","explica":"Ser pobre en espíritu es reconocer que necesitamos a Dios, que solos no podemos. Jesús dice que a esas personas humildes les pertenece el reino de los cielos."},{"libro":"Salmos","cap":"89","vers":"1","texto":"Las misericordias de Jehová cantaré perpetuamente; de generación en generación haré notoria tu fidelidad con mi boca.","explica":"El salmista decide cantar siempre del amor de Dios y contar su fidelidad a cada generación. Los abuelos son quienes mejor pueden contar a los nietos lo fiel que ha sido Dios."},{"libro":"Isaías","cap":"40","vers":"29","texto":"Él da esfuerzo al cansado, y multiplica las fuerzas al que no tiene ningunas.","explica":"Dios da fuerzas al cansado y multiplica la energía del que ya no tiene. Cuando sentimos que no podemos más, Él nos da lo que nos falta."},{"libro":"Juan","cap":"14","vers":"23","texto":"Respondió Jesús y le dijo: El que me ama, mi palabra guardará; y mi Padre le amará, y vendremos a él, y haremos morada con él.","explica":"Jesús promete que quien lo ama y guarda su palabra tendrá a Dios viviendo con él. Dios no solo nos visita: quiere hacer su casa en nuestro corazón."},{"libro":"Salmos","cap":"37","vers":"23-24","texto":"Por Jehová son ordenados los pasos del hombre, y él aprueba su camino. Cuando el hombre cayere, no quedará postrado, porque Jehová sostiene su mano.","explica":"Dios dirige los pasos de quienes confían en Él. Y aunque a veces tropecemos y caigamos, no nos quedaremos en el suelo, porque Dios nos sostiene de la mano."},{"libro":"Efesios","cap":"6","vers":"10","texto":"Por lo demás, hermanos míos, fortaleceos en el Señor, y en el poder de su fuerza.","explica":"Pablo nos anima a ser fuertes, pero no con nuestra propia fuerza, sino con la del Señor. Cuando nos apoyamos en Dios, tenemos una fuerza que no se agota."},{"libro":"Salmos","cap":"91","vers":"11","texto":"Pues a sus ángeles mandará acerca de ti, que te guarden en todos tus caminos.","explica":"Dios manda a sus ángeles a cuidarnos en todos nuestros caminos. Aunque no los veamos, Dios tiene cuidado de nosotros en cada paso que damos."},{"libro":"1 Pedro","cap":"5","vers":"10","texto":"Mas el Dios de toda gracia, que nos llamó a su gloria eterna en Jesucristo, después que hayáis padecido un poco de tiempo, él mismo os perfeccione, afirme, fortalezca y establezca.","explica":"Pedro reconoce que a veces sufrimos, pero promete que ese tiempo es corto comparado con la eternidad. Después Dios mismo nos restaura, nos afirma y nos fortalece."},{"libro":"Salmos","cap":"8","vers":"1","texto":"Oh Jehová, Señor nuestro, ¡cuán glorioso es tu nombre en toda la tierra!","explica":"David contempla el cielo y la creación y se maravilla: ¡qué grande es el nombre de Dios en toda la tierra! Mirar la naturaleza es una buena forma de recordar su grandeza."},{"libro":"Proverbios","cap":"3","vers":"24","texto":"Cuando te acuestes, no tendrás temor, sino que te acostarás, y tu sueño será grato.","explica":"Quien confía en Dios puede acostarse sin miedo y dormir tranquilo. Dios cuida nuestro sueño. Es una promesa para las noches en que cuesta dormir."},{"libro":"Salmos","cap":"18","vers":"28","texto":"Tú encenderás mi lámpara; Jehová mi Dios alumbrará mis tinieblas.","explica":"Cuando todo parece oscuro, Dios enciende una lámpara en nuestra vida. Él alumbra nuestras tinieblas y nos ayuda a ver de nuevo con esperanza."},{"libro":"Juan","cap":"6","vers":"37","texto":"Todo lo que el Padre me da, vendrá a mí; y al que a mí viene, no le echo fuera.","explica":"Jesús promete que no rechaza a nadie que se acerque a Él. No importa cómo llegues, cansada o con errores: Jesús te recibe con los brazos abiertos."},{"libro":"Salmos","cap":"104","vers":"33","texto":"A Jehová cantaré en mi vida; a mi Dios cantaré salmos mientras viva.","explica":"El salmista decide cantarle a Dios toda la vida, mientras viva. La alabanza no tiene edad: se puede cantar a Dios en la juventud y en la vejez."},{"libro":"Hebreos","cap":"10","vers":"23","texto":"Mantengamos firme, sin fluctuar, la profesión de nuestra esperanza, porque fiel es el que prometió.","explica":"Este versículo nos anima a mantenernos firmes en la esperanza, sin dudar. La razón es que Dios, quien hizo las promesas, siempre cumple."},{"libro":"Salmos","cap":"119","vers":"76","texto":"Sea ahora tu misericordia para consolarme, conforme a lo que has dicho a tu siervo.","explica":"El salmista le pide a Dios que su amor lo consuele, como Él mismo lo prometió. Podemos pedirle a Dios consuelo recordándole sus propias promesas."},{"libro":"Isaías","cap":"49","vers":"15-16","texto":"¿Se olvidará la mujer de lo que dio a luz, para dejar de compadecerse del hijo de su vientre? Aunque olvide ella, yo nunca me olvidaré de ti. He aquí que en las palmas de las manos te tengo esculpida.","explica":"Una madre difícilmente se olvida de su bebé. Pero Dios dice que aunque una madre se olvidara, Él nunca se olvidará de nosotros. Nos tiene grabados en las palmas de sus manos."},{"libro":"Mateo","cap":"22","vers":"37","texto":"Jesús le dijo: Amarás al Señor tu Dios con todo tu corazón, y con toda tu alma, y con toda tu mente.","explica":"Le preguntaron a Jesús cuál era el mandamiento más importante. Respondió: amar a Dios con todo, con el corazón, el alma y la mente. Es lo primero y lo más importante."},{"libro":"Salmos","cap":"39","vers":"7","texto":"Y ahora, Señor, ¿qué esperaré? Mi esperanza está en ti.","explica":"El salmista se pregunta: ¿en qué voy a poner mi esperanza? Y se responde: en ti, Señor. Cuando todo lo demás falla, Dios sigue siendo nuestra esperanza."},{"libro":"Santiago","cap":"4","vers":"8","texto":"Acercaos a Dios, y él se acercará a vosotros.","explica":"Una promesa sencilla: si nos acercamos a Dios, Él se acerca a nosotros. Basta dar un paso hacia Él, con una oración o leyendo su Palabra."},{"libro":"Salmos","cap":"115","vers":"1","texto":"No a nosotros, oh Jehová, no a nosotros, sino a tu nombre da gloria, por tu misericordia, por tu verdad.","explica":"Este versículo nos enseña humildad: la gloria no es para nosotros, sino para Dios. Lo bueno que tenemos y hacemos viene de su amor y su fidelidad."},{"libro":"Juan","cap":"15","vers":"9","texto":"Como el Padre me ha amado, así también yo os he amado; permaneced en mi amor.","explica":"Jesús nos ama con el mismo amor con que el Padre lo ama a Él. Y nos pide algo: permanecer en su amor, quedarnos cerca de Él cada día."},{"libro":"Salmos","cap":"20","vers":"4","texto":"Te dé conforme al deseo de tu corazón, y cumpla todo tu consejo.","explica":"Esta es una bendición: que Dios te conceda lo que tu corazón desea y que se cumplan tus planes. Es una oración bonita para hacer por los seres queridos."},{"libro":"Proverbios","cap":"19","vers":"21","texto":"Muchos pensamientos hay en el corazón del hombre; mas el consejo de Jehová permanecerá.","explica":"Las personas hacemos muchos planes, pero al final lo que Dios decide es lo que se cumple. Es bueno hacer planes, pero mejor ponerlos en sus manos."},{"libro":"Salmos","cap":"46","vers":"5","texto":"Dios está en medio de ella; no será conmovida. Dios la ayudará al clarear la mañana.","explica":"El salmista habla de la ciudad donde Dios vive: no será derribada, porque Dios está en medio de ella y la ayuda al amanecer. Si Dios está en nuestra casa, estamos firmes."},{"libro":"Colosenses","cap":"3","vers":"14","texto":"Y sobre todas estas cosas vestíos de amor, que es el vínculo perfecto.","explica":"Pablo dice que el amor es como la prenda que va encima de todo y lo une todo. Sin amor, las demás virtudes se desarman. El amor mantiene unida a la familia."},{"libro":"Salmos","cap":"23","vers":"2-3","texto":"En lugares de delicados pastos me hará descansar; junto a aguas de reposo me pastoreará. Confortará mi alma; me guiará por sendas de justicia por amor de su nombre.","explica":"El past
